# Sentinel theme (dark, GHL-style navy with Sentinel blue).
# configuration.yaml needs, once:
#   frontend:
#     themes: !include_dir_merge_named themes
# then put this file in config/themes/ and run "Reload themes"
# (Developer tools > YAML > Themes).
Sentinel:
  # base
  primary-color: "#2F8FFF"
  accent-color: "#33D1E0"
  primary-background-color: "#0A111D"
  secondary-background-color: "#101A2B"
  lovelace-background: "#0A111D"
  primary-text-color: "#E7EEF8"
  secondary-text-color: "#9AABC4"
  disabled-text-color: "#5E6F88"
  divider-color: "#22324A"
  # header / sidebar
  app-header-background-color: "#0A111D"
  app-header-text-color: "#E7EEF8"
  app-header-selection-bar-color: "#2F8FFF"
  sidebar-background-color: "#0D1524"
  sidebar-text-color: "#C6D3E6"
  sidebar-selected-text-color: "#2F8FFF"
  sidebar-selected-icon-color: "#2F8FFF"
  sidebar-icon-color: "#9AABC4"
  # cards
  card-background-color: "#121D30"
  ha-card-background: "#121D30"
  ha-card-border-radius: "14px"
  ha-card-border-width: "1px"
  ha-card-border-color: "#22324A"
  ha-card-box-shadow: "none"
  ha-card-header-color: "#E7EEF8"
  # states
  state-icon-color: "#33D1E0"
  state-active-color: "#2F8FFF"
  state-on-color: "#2F8FFF"
  state-off-color: "#5E6F88"
  state-input_boolean-on-color: "#2F8FFF"
  state-switch-on-color: "#33D1E0"
  state-script-color: "#2F8FFF"
  success-color: "#33D1A0"
  warning-color: "#F2A93B"
  error-color: "#F0645A"
  info-color: "#2F8FFF"
  # controls
  switch-checked-color: "#2F8FFF"
  switch-checked-button-color: "#2F8FFF"
  switch-checked-track-color: "#2F8FFF"
  switch-unchecked-button-color: "#9AABC4"
  switch-unchecked-track-color: "#3A4B66"
  paper-slider-knob-color: "#2F8FFF"
  paper-slider-active-color: "#2F8FFF"
  input-fill-color: "#0E1828"
  ha-color-form-background: "#0E1828"
  ha-color-form-background-hover: "#15233A"
  ha-color-form-background-disabled: "#0B1422"
  input-ink-color: "#E7EEF8"
  input-label-ink-color: "#9AABC4"
  mdc-text-field-fill-color: "#0E1828"
  mdc-text-field-ink-color: "#E7EEF8"
  mdc-text-field-label-ink-color: "#9AABC4"
  mdc-select-fill-color: "#0E1828"
  mdc-select-ink-color: "#E7EEF8"
  mdc-select-label-ink-color: "#9AABC4"
  # gauges / charts
  label-badge-red: "#F0645A"
  label-badge-blue: "#2F8FFF"
  label-badge-green: "#33D1A0"
  label-badge-yellow: "#F2A93B"
  history-unknown-color: "#3A4B66"
  # markdown
  markdown-code-background-color: "#0E1828"
  code-editor-background-color: "#0E1828"
  codemirror-property: "#33D1E0"
