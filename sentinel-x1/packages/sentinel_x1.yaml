# =====================================================================
#  Sentinel X1 Pro-T — smart dosing engine for the Kamoer X1 Pro-T
#  Home Assistant package. Drives the local Kamoer bridge entities:
#    number.kamoer_x1_pro_t_kamoer_speed, number.kamoer_x1_pro_t_kamoer_dose_volume,
#    button.kamoer_x1_pro_t_kamoer_dose_now, switch.kamoer_x1_pro_t_kamoer_continuous,
#    button.kamoer_x1_pro_t_kamoer_stop, sensor.kamoer_x1_pro_t_kamoer_status
#
#  Install: config/packages/sentinel_x1.yaml, then in configuration.yaml
#    homeassistant:
#      packages:
#        sentinel_x1: !include packages/sentinel_x1.yaml
#  REMOVE the old kamoer_doser package line first, or both will dose.
#  After restart run script "Sentinel X1 · Load defaults" once.
# =====================================================================

input_boolean:
  sentinel_x1_enabled:
    name: Sentinel X1 dosing enabled
    icon: mdi:power
  sentinel_x1_ramp:
    name: Ramp target changes (max 5%/day)
    icon: mdi:stairs
  sentinel_x1_feed_enabled:
    name: Feeding pause
    icon: mdi:fish
  sentinel_x1_ph_hold:
    name: pH hold (Meckley Method)
    icon: mdi:ph
  sentinel_x1_ph_fallback:
    name: pH hold fell back to daily plan
    icon: mdi:backup-restore
  sentinel_x1_kh_enabled:
    name: KH auto-tune
    icon: mdi:tune-variant
  sentinel_x1_calibrating:
    name: Calibration run in progress
    icon: mdi:beaker-question
  sentinel_x1_cal_reminded:
    name: Calibration reminder sent
    icon: mdi:bell-check
  sentinel_x1_cal_reminder_dismissed:
    name: Calibration reminder dismissed
    icon: mdi:bell-off
  sentinel_x1_cal_paused:
    name: Schedule turned off for calibration
    icon: mdi:calendar-remove
  sentinel_x1_cal_ask_restart:
    name: Ask to restart the schedule after calibration
    icon: mdi:calendar-question
  # overdose guards: tank chemistry says too much is going in
  sentinel_x1_ph_trip:
    name: Dosing paused, pH above alarm limit
    icon: mdi:ph
  sentinel_x1_kh_trip:
    name: Dosing paused, KH above ceiling
    icon: mdi:test-tube-off

input_select:
  sentinel_x1_mode:
    name: Delivery mode
    icon: mdi:water-sync
    options: [Auto, Microdose, Continuous, Bolus]
  sentinel_x1_window:
    name: Dose across
    icon: mdi:clock-time-eight-outline
    options: ["24 hours", "Start / stop"]
  sentinel_x1_curve:
    name: Distribution
    icon: mdi:chart-bell-curve
    options: [Flat, Follow photoperiod, Night-weighted]
  sentinel_x1_missed:
    name: Missed volume (feed pause)
    icon: mdi:restore
    options: ["Catch up over 6 h", "Drop it"]
  sentinel_x1_pause_kind:
    name: Active pause
    icon: mdi:pause-circle
    options: ["Off", "Feed", "Maintenance"]
  sentinel_x1_notify_target:
    name: Send alerts to
    icon: mdi:cellphone-message
    options: ["Not used"]
  sentinel_x1_ph_source:
    name: pH probe
    icon: mdi:ph
    options: ["Not used"]
  sentinel_x1_kh_source:
    name: KH reading from
    icon: mdi:test-tube
    options: ["Manual entry"]
  sentinel_x1_return_source:
    name: Return pump outlet
    icon: mdi:pump
    options: ["Not used"]
  sentinel_x1_kh_product:
    name: Alkalinity product
    icon: mdi:bottle-tonic-outline
    options: ["Saturated kalkwasser", "Red Sea Reef Foundation B", "ESV B-Ionic Component 1", "Fritz RPM Part 1", "Brightwell Reef Code B", "Brightwell Alkalin8.3", "BRS Pharma Soda Ash (1 gal mix)", "BRS Pharma Sodium Bicarbonate (1 gal mix)", "Tropic Marin All-For-Reef", "Aquaforest Component 2+", "Aquaforest Component 2 Pro", "Aquaforest KH Plus", "Seachem Reef Carbonate", "Seachem Reef Fusion 2", "Simple Science Alkalinity Part C", "Custom"]
  sentinel_x1_volume_unit:
    name: Volume unit
    icon: mdi:ruler
    options: ["US gal", "L"]
  sentinel_x1_kh_phase:
    name: KH auto-tune state
    icon: mdi:state-machine
    options: ["Off", "Ready", "Correcting", "Needs manual test"]

input_datetime:
  sentinel_x1_start:
    name: Window start
    has_date: false
    has_time: true
  sentinel_x1_stop:
    name: Window stop
    has_date: false
    has_time: true
  sentinel_x1_lights_on:
    name: Lights on
    has_date: false
    has_time: true
  sentinel_x1_lights_off:
    name: Lights off
    has_date: false
    has_time: true
  sentinel_x1_feed_start:
    name: Feeding pause starts
    has_date: false
    has_time: true
  sentinel_x1_pause_until:
    name: Paused until
    has_date: true
    has_time: true
  sentinel_x1_kh_manual_at:
    name: Last manual KH test time
    has_date: true
    has_time: true
  sentinel_x1_last_cal:
    name: Last calibration
    has_date: true
    has_time: false

input_text:
  sentinel_x1_ph_entity:
    name: pH sensor entity
    icon: mdi:ph
  sentinel_x1_return_entity:
    name: Return pump entity (on = flowing)
    icon: mdi:pump
  sentinel_x1_awc_entity:
    name: Water-change entity (on = AWC running)
    icon: mdi:water-sync
  sentinel_x1_maint_entity:
    name: Maintenance entity (on = maintenance)
    icon: mdi:wrench
  sentinel_x1_kh_entity:
    name: KH sensor entity
    icon: mdi:test-tube
  sentinel_x1_notify:
    name: Notify action (e.g. notify.mobile_app_iphone)
    icon: mdi:bell-ring
  sentinel_x1_ph_fallback_why:
    name: pH hold fallback reason
    icon: mdi:alert-circle-outline
    max: 255

timer:
  # countdown for whichever calibration run is going (dashboard shows it)
  sentinel_x1_cal:
    name: Sentinel X1 calibration run
    icon: mdi:timer-sand
  # reminder that the schedule is still off after calibration (15 min, then every 30)
  sentinel_x1_sched_alert:
    name: Sentinel X1 schedule-off reminder
    icon: mdi:bell-ring

input_number:
  # ---- schedule ----
  sentinel_x1_target_ml:
    name: Daily target
    min: 0
    max: 5000
    step: 0.5
    mode: box
    unit_of_measurement: mL
    icon: mdi:target
  sentinel_x1_effective_ml:
    name: Daily volume in effect
    min: 0
    max: 5000
    step: 0.01
    mode: box
    unit_of_measurement: mL
    icon: mdi:cup-water
  sentinel_x1_feed_minutes:
    name: Feed pause length
    min: 1
    max: 240
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:fish
  sentinel_x1_maint_minutes:
    name: Maintenance pause length
    min: 1
    max: 480
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:wrench
  sentinel_x1_feed_n:
    name: Sentinel Controller feed pause
    min: 1
    max: 4
    step: 1
    mode: box
    icon: mdi:numeric
  sentinel_x1_maint_n:
    name: Sentinel Controller maintenance mode
    min: 1
    max: 4
    step: 1
    mode: box
    icon: mdi:numeric
  # ---- pump limits / calibration ----
  sentinel_x1_min_rpm:
    name: Min stable continuous speed
    min: 1
    max: 350
    step: 1
    mode: box
    unit_of_measurement: RPM
    icon: mdi:speedometer-slow
  sentinel_x1_pulse_rpm:
    name: Pulse speed
    min: 1
    max: 350
    step: 1
    mode: box
    unit_of_measurement: RPM
    icon: mdi:speedometer
  sentinel_x1_min_pulse:
    name: Smallest accurate pulse
    min: 0.1
    max: 5
    step: 0.1
    mode: box
    unit_of_measurement: mL
    icon: mdi:water-outline
  sentinel_x1_cal_low_collected:
    name: Low speed — mL collected in 5 min
    min: 0
    max: 200
    step: 0.01
    mode: box
    unit_of_measurement: mL
    icon: mdi:beaker-outline
  # expected mL for each calibration run, snapshotted when the run starts (dashboard shows ±10 %)
  sentinel_x1_cal_expect_low:
    name: Calibration expected — low speed run
    min: 0
    max: 1000
    step: 0.01
    mode: box
    unit_of_measurement: mL
    icon: mdi:target
  sentinel_x1_cal_expect_mid:
    name: Calibration expected — 200 RPM run
    min: 0
    max: 1000
    step: 0.01
    mode: box
    unit_of_measurement: mL
    icon: mdi:target
  sentinel_x1_cal_expect_high:
    name: Calibration expected — 350 RPM run
    min: 0
    max: 1000
    step: 0.01
    mode: box
    unit_of_measurement: mL
    icon: mdi:target
  # ---- speed test (Settings): timed run at any speed into a cylinder ----
  sentinel_x1_test_rpm:
    name: Speed test — speed
    min: 1
    max: 350
    step: 1
    mode: box
    unit_of_measurement: RPM
    icon: mdi:speedometer
  sentinel_x1_test_minutes:
    name: Speed test — run time
    min: 1
    max: 29
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:timer-outline
  sentinel_x1_test_collected:
    name: Speed test — mL collected
    min: 0
    max: 500
    step: 0.01
    mode: box
    unit_of_measurement: mL
    icon: mdi:beaker-outline
  sentinel_x1_test_last_rpm:
    name: Speed test — last run speed
    min: 0
    max: 350
    step: 1
    mode: box
    unit_of_measurement: RPM
  sentinel_x1_test_last_minutes:
    name: Speed test — last run time
    min: 0
    max: 60
    step: 0.01
    mode: box
    unit_of_measurement: min
  sentinel_x1_pulse_check_ml:
    name: Pulse check — mL collected
    min: 0
    max: 50
    step: 0.01
    mode: box
    unit_of_measurement: mL
    icon: mdi:beaker-check-outline
  sentinel_x1_prime_seconds:
    name: Prime time
    min: 3
    max: 120
    step: 1
    mode: box
    unit_of_measurement: s
    icon: mdi:pipe-valve
  sentinel_x1_tank_volume:
    name: Tank water volume
    min: 0
    max: 5000
    step: 0.1
    mode: box
    icon: mdi:waves
  sentinel_x1_kh_custom_strength:
    name: Custom strength (dKH per mL per 100 L)
    min: 0
    max: 1
    step: 0.0001
    mode: box
    icon: mdi:flask
  sentinel_x1_kh_max_rise:
    name: Max KH rise per day
    min: 0.1
    max: 1.4
    step: 0.1
    mode: box
    unit_of_measurement: dKH
    icon: mdi:arrow-up-bold
  sentinel_x1_kh_wait_days:
    name: Waiting period
    min: 1
    max: 7
    step: 1
    mode: box
    unit_of_measurement: d
    icon: mdi:timer-sand
  sentinel_x1_kh_tolerance:
    name: Tolerance
    min: 10
    max: 80
    step: 5
    mode: box
    unit_of_measurement: "%"
    icon: mdi:plus-minus-variant
  sentinel_x1_kh_manual:
    name: Last manual KH test
    min: 0
    max: 20
    step: 0.01
    mode: box
    unit_of_measurement: dKH
    icon: mdi:test-tube
  sentinel_x1_kh_start:
    name: KH at start of cycle
    min: 0
    max: 20
    step: 0.01
    mode: box
  sentinel_x1_kh_expected:
    name: Expected KH change this cycle
    min: -10
    max: 10
    step: 0.001
    mode: box
    unit_of_measurement: dKH
  sentinel_x1_kh_corr_ml_day:
    name: Correction per day
    min: -5000
    max: 5000
    step: 0.01
    mode: box
    unit_of_measurement: mL
  sentinel_x1_kh_cycle_day:
    name: Day of cycle
    min: 0
    max: 10
    step: 1
    mode: box
  # ---- caps ----
  sentinel_x1_daily_cap_pct:
    name: Daily ceiling (% of daily volume)
    min: 100
    max: 200
    step: 5
    mode: box
    unit_of_measurement: "%"
    icon: mdi:shield-alert
  sentinel_x1_hourly_cap_x:
    name: Hourly ceiling (× busiest planned hour)
    min: 1
    max: 5
    step: 0.1
    mode: box
    icon: mdi:shield-alert-outline
  sentinel_x1_manual_ml:
    name: Manual dose
    min: 0.1
    max: 50
    step: 0.1
    mode: box
    unit_of_measurement: mL
    icon: mdi:hand-water
  sentinel_x1_manual_max:
    name: Manual dose limit
    min: 1
    max: 50
    step: 1
    mode: box
    unit_of_measurement: mL
    icon: mdi:hand-back-left-off
  # ---- pH ----
  sentinel_x1_ph_stop:
    name: pH alarm above
    min: 7
    max: 9.5
    step: 0.01
    mode: box
    icon: mdi:arrow-collapse-up
  sentinel_x1_ph_resume:
    name: pH alarm below
    min: 6.5
    max: 9
    step: 0.01
    mode: box
    icon: mdi:arrow-collapse-down
  # ---- pH hold (Meckley Method) ----
  sentinel_x1_ph_target:
    name: pH hold target
    min: 7.8
    max: 8.6
    step: 0.01
    mode: box
    icon: mdi:target
  sentinel_x1_ph_max_ml_h:
    name: pH hold max per hour
    min: 0.5
    max: 200
    step: 0.5
    mode: box
    unit_of_measurement: mL
    icon: mdi:speedometer
  sentinel_x1_ph_max_ml_day:
    name: pH hold max per day
    min: 5
    max: 5000
    step: 5
    mode: box
    unit_of_measurement: mL
    icon: mdi:water-check
  sentinel_x1_ph_max_kh:
    name: pH hold stops above KH
    min: 7
    max: 14
    step: 0.1
    mode: box
    unit_of_measurement: dKH
    icon: mdi:test-tube
  sentinel_x1_ph_hr_start:
    name: pH at start of hour (internal)
    min: 0
    max: 14
    step: 0.001
    mode: box
  sentinel_x1_ph_streak_h:
    name: pH hold full-rate hours (internal)
    min: 0
    max: 48
    step: 1
    mode: box
  sentinel_x1_ph_streak_ml:
    name: pH hold full-rate mL (internal)
    min: 0
    max: 10000
    step: 0.01
    mode: box
  sentinel_x1_ph_streak_start:
    name: pH at start of full-rate run (internal)
    min: 0
    max: 14
    step: 0.001
    mode: box
  # ---- container / tubing ----
  sentinel_x1_container_ml:
    name: Container remaining
    min: 0
    max: 20000
    step: 0.1
    mode: box
    unit_of_measurement: mL
    icon: mdi:bottle-tonic
  sentinel_x1_container_size:
    name: Container size
    min: 100
    max: 20000
    step: 50
    mode: box
    unit_of_measurement: mL
    icon: mdi:bottle-tonic-outline
  sentinel_x1_container_alert_days:
    name: Container alert at
    min: 1
    max: 30
    step: 1
    mode: box
    unit_of_measurement: days
    icon: mdi:calendar-alert
  sentinel_x1_container_stop_ml:
    name: Stop dosing at
    min: 0
    max: 500
    step: 10
    mode: box
    unit_of_measurement: mL
    icon: mdi:bottle-tonic-skull-outline
  sentinel_x1_tube_hours:
    name: Tubing run time
    min: 0
    max: 5000
    step: 0.001
    mode: box
    unit_of_measurement: h
    icon: mdi:timer-sand
  sentinel_x1_tube_life:
    name: Tubing rated life
    min: 100
    max: 5000
    step: 100
    mode: box
    unit_of_measurement: h
    icon: mdi:timer-sand-complete
  # ---- engine bookkeeping (managed by automations) ----
  sentinel_x1_today_ml:
    name: Delivered today
    min: 0
    max: 5000
    step: 0.001
    mode: box
    unit_of_measurement: mL
    icon: mdi:water-check
  sentinel_x1_hour_ml:
    name: Delivered this hour
    min: 0
    max: 5000
    step: 0.001
    mode: box
    unit_of_measurement: mL
  sentinel_x1_owed_ml:
    name: Accrued, not yet pulsed
    min: 0
    max: 5000
    step: 0.001
    mode: box
    unit_of_measurement: mL
  sentinel_x1_debt_ml:
    name: Catch-up owed
    min: 0
    max: 5000
    step: 0.001
    mode: box
    unit_of_measurement: mL
    icon: mdi:restore-alert
  # ---- KH auto-tune ----
  sentinel_x1_kh_target:
    name: KH target
    min: 5
    max: 14
    step: 0.05
    mode: box
    unit_of_measurement: dKH
    icon: mdi:target-variant
  sentinel_x1_kh_base_ml:
    name: KH base dose (holds KH steady)
    min: 0
    max: 5000
    step: 0.01
    mode: box
    unit_of_measurement: mL
  sentinel_x1_kh_last:
    name: KH last reading used
    min: 0
    max: 20
    step: 0.01
    mode: box
  sentinel_x1_kh_last_dir:
    name: KH last adjustment direction
    min: -1
    max: 1
    step: 1
    mode: box
  sentinel_x1_kh_strikes:
    name: KH no-response count
    min: 0
    max: 10
    step: 1
    mode: box

# =====================================================================
#  ENGINE — recomputed every minute and whenever a setting changes
# =====================================================================
template:
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
      - platform: event
        event_type: event_template_reloaded
      - platform: state
        entity_id:
          - input_boolean.sentinel_x1_enabled
          - input_boolean.sentinel_x1_ph_hold
          - input_boolean.sentinel_x1_ph_fallback
          - input_number.sentinel_x1_ph_target
          - input_number.sentinel_x1_ph_max_ml_h
          - input_number.sentinel_x1_ph_max_ml_day
          - input_number.sentinel_x1_ph_max_kh
          - input_select.sentinel_x1_kh_product
          - input_boolean.sentinel_x1_calibrating
          - input_boolean.sentinel_x1_ph_trip
          - input_boolean.sentinel_x1_kh_trip
          - binary_sensor.kamoer_x1_pro_t_kamoer_pulse_fault
          - input_boolean.sentinel_x1_feed_enabled
          - input_select.sentinel_x1_mode
          - input_select.sentinel_x1_window
          - input_select.sentinel_x1_curve
          - input_select.sentinel_x1_missed
          - input_datetime.sentinel_x1_start
          - input_datetime.sentinel_x1_stop
          - input_datetime.sentinel_x1_lights_on
          - input_datetime.sentinel_x1_lights_off
          - input_datetime.sentinel_x1_pause_until
          - input_select.sentinel_x1_pause_kind
          - binary_sensor.sentinel_controller_water_change
          - binary_sensor.sentinel_controller_feed_pause_1
          - binary_sensor.sentinel_controller_feed_pause_2
          - binary_sensor.sentinel_controller_feed_pause_3
          - binary_sensor.sentinel_controller_feed_pause_4
          - binary_sensor.sentinel_controller_maintenance_1
          - binary_sensor.sentinel_controller_maintenance_2
          - binary_sensor.sentinel_controller_maintenance_3
          - binary_sensor.sentinel_controller_maintenance_4
          - input_number.sentinel_x1_effective_ml
          - number.kamoer_x1_pro_t_kamoer_cal_low_speed
          - number.kamoer_x1_pro_t_kamoer_cal_low
          - number.kamoer_x1_pro_t_kamoer_cal_200_rpm
          - number.kamoer_x1_pro_t_kamoer_cal_350_rpm
          - input_number.sentinel_x1_min_rpm
          - input_number.sentinel_x1_pulse_rpm
          - input_number.sentinel_x1_min_pulse
          - sensor.kamoer_x1_pro_t_kamoer_status
    action:
      - variables:
          en: "{{ is_state('input_boolean.sentinel_x1_enabled', 'on') }}"
          daily: "{{ states('input_number.sentinel_x1_effective_ml') | float(0) }}"
          kalk: "{{ is_state('input_select.sentinel_x1_kh_product', 'Saturated kalkwasser') }}"
          ph_on: "{{ is_state('input_boolean.sentinel_x1_ph_hold', 'on') and is_state('input_boolean.sentinel_x1_ph_fallback', 'off') and kalk }}"
          ph_v: >-
            {%- set e = states('input_text.sentinel_x1_ph_entity') | trim -%}
            {{ states(e) | float(-1) if e else -1 }}
          ph_t: "{{ states('input_number.sentinel_x1_ph_target') | float(8.29) }}"
          ph_mlh: "{{ states('input_number.sentinel_x1_ph_max_ml_h') | float(0) }}"
          ph_mld: "{{ states('input_number.sentinel_x1_ph_max_ml_day') | float(0) }}"
          ph_kh_max: "{{ states('input_number.sentinel_x1_ph_max_kh') | float(99) }}"
          kh_now: "{{ states('sensor.sentinel_x1_kh') | float(0) }}"
          ph_frac: "{{ ([[(ph_t - ph_v) / 0.1, 0] | max, 1] | min) if ph_v > 0 else 0 }}"
          ph_rate: "{{ ph_mlh / 60 * ph_frac }}"
          nm: "{{ now().hour * 60 + now().minute }}"
          hnow: "{{ now().hour }}"
          win24: "{{ is_state('input_select.sentinel_x1_window', '24 hours') }}"
          s0: "{{ (state_attr('input_datetime.sentinel_x1_start', 'hour') | int(0)) * 60 + (state_attr('input_datetime.sentinel_x1_start', 'minute') | int(0)) }}"
          s1: "{{ (state_attr('input_datetime.sentinel_x1_stop', 'hour') | int(0)) * 60 + (state_attr('input_datetime.sentinel_x1_stop', 'minute') | int(0)) }}"
          lon: "{{ (state_attr('input_datetime.sentinel_x1_lights_on', 'hour') | int(0)) * 60 + (state_attr('input_datetime.sentinel_x1_lights_on', 'minute') | int(0)) }}"
          loff: "{{ (state_attr('input_datetime.sentinel_x1_lights_off', 'hour') | int(0)) * 60 + (state_attr('input_datetime.sentinel_x1_lights_off', 'minute') | int(0)) }}"
          curve: "{{ states('input_select.sentinel_x1_curve') }}"
          in_win: >-
            {%- if win24 or s0 == s1 -%}true
            {%- elif s1 > s0 -%}{{ nm >= s0 and nm < s1 }}
            {%- else -%}{{ nm >= s0 or nm < s1 }}{%- endif -%}
          hour_min: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for h in range(24) -%}
              {%- set a = h * 60 -%}{%- set b = a + 60 -%}
              {%- if win24 or s0 == s1 -%}{%- set c = 60 -%}
              {%- elif s1 > s0 -%}{%- set c = [0, ([b, s1] | min) - ([a, s0] | max)] | max -%}
              {%- else -%}{%- set c = ([0, b - ([a, s0] | max)] | max) + ([0, ([b, s1] | min) - a] | max) -%}
              {%- endif -%}
              {%- set ns.l = ns.l + [c] -%}
            {%- endfor -%}
            {{ ns.l }}
          weights: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for h in range(24) -%}
              {%- set m = h * 60 + 30 -%}
              {%- if loff > lon -%}{%- set lit = m >= lon and m < loff -%}
              {%- elif loff < lon -%}{%- set lit = m >= lon or m < loff -%}
              {%- else -%}{%- set lit = false -%}{%- endif -%}
              {%- if curve == 'Follow photoperiod' -%}{%- set w = 1.5 if lit else 0.65 -%}
              {%- elif curve == 'Night-weighted' -%}{%- set w = 0.7 if lit else 1.5 -%}
              {%- else -%}{%- set w = 1.0 -%}{%- endif -%}
              {%- set ns.l = ns.l + [w] -%}
            {%- endfor -%}
            {{ ns.l }}
          sumw: >-
            {%- set ns = namespace(s=0) -%}
            {%- for h in range(24) -%}{%- set ns.s = ns.s + hour_min[h] * weights[h] -%}{%- endfor -%}
            {{ ns.s }}
          minw: >-
            {%- set ns = namespace(v=99) -%}
            {%- for h in range(24) -%}{%- if hour_min[h] > 0 and weights[h] < ns.v -%}{%- set ns.v = weights[h] -%}{%- endif -%}{%- endfor -%}
            {{ ns.v if ns.v < 99 else 1 }}
          maxhour: >-
            {%- set ns = namespace(v=0) -%}
            {%- for h in range(24) -%}{%- set x = hour_min[h] * weights[h] -%}{%- if x > ns.v -%}{%- set ns.v = x -%}{%- endif -%}{%- endfor -%}
            {{ (daily * ns.v / sumw) if sumw > 0 else 0 }}
          win_min: "{{ hour_min | sum }}"
          rate_avg: "{{ (daily / win_min) if win_min > 0 else 0 }}"
          rate_plan: "{{ ph_rate if ph_on else ((daily * weights[hnow] / sumw) if (in_win and sumw > 0) else 0) }}"
          fcurve: >-
            {%- set lr = states('number.kamoer_x1_pro_t_kamoer_cal_low_speed') | float(30) -%}
            {%- set ns = namespace(p=[[0, 0]]) -%}
            {%- for r, f in [[lr, states('number.kamoer_x1_pro_t_kamoer_cal_low') | float(0)], [200, states('number.kamoer_x1_pro_t_kamoer_cal_200_rpm') | float(0)], [350, states('number.kamoer_x1_pro_t_kamoer_cal_350_rpm') | float(0)]] -%}
              {%- if f > 0 and r > ns.p[-1][0] -%}{%- set ns.p = ns.p + [[r, f]] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.p }}
          # all three speed points are required before anything doses
          cal_ok: "{{ fcurve | count >= 4 }}"
          min_rpm: "{{ states('input_number.sentinel_x1_min_rpm') | float(30) }}"
          pulse_rpm: "{{ states('input_number.sentinel_x1_pulse_rpm') | float(200) }}"
          # smallest pulse the engine will ever send: 2 full pump-head turns at pulse speed.
          # Sub-turn pulses deliver anywhere from 0.4x to 2.5x (roller position, ramps, tube spring-back).
          pulse_floor: >-
            {%- set ns = namespace(v=0, done=false) -%}{%- set p = fcurve -%}{%- set r = pulse_rpm -%}{%- for i in range(1, p | count) -%}{%- if not ns.done and (r <= p[i][0] or loop.last) -%}{%- set ns.v = p[i-1][1] + (r - p[i-1][0]) * (p[i][1] - p[i-1][1]) / (p[i][0] - p[i-1][0]) -%}{%- set ns.done = true -%}{%- endif -%}{%- endfor -%}{{ (2 * ns.v / pulse_rpm) if (pulse_rpm > 0 and ns.v > 0) else 0.5 }}
          min_pulse: "{{ ((([states('input_number.sentinel_x1_min_pulse') | float(0.1), 0.1, pulse_floor] | max) * 10) | round(0, 'ceil')) / 10 }}"
          sel: "{{ states('input_select.sentinel_x1_mode') }}"
          rpm_low: >-
            {%- set ns = namespace(r=0, done=false) -%}{%- set p = fcurve -%}{%- set f = ((daily * minw / sumw) if sumw > 0 else 0) -%}{%- for i in range(1, p | count) -%}{%- if not ns.done and (f <= p[i][1] or loop.last) -%}{%- set ns.r = p[i-1][0] + (f - p[i-1][1]) * (p[i][0] - p[i-1][0]) / ([p[i][1] - p[i-1][1], 0.0001] | max) -%}{%- set ns.done = true -%}{%- endif -%}{%- endfor -%}{{ ns.r if cal_ok else 0 }}
          # mL/min the slowest planned hour needs, and the mL/min at the minimum stable speed
          flow_low: "{{ ((daily * minw / sumw) if sumw > 0 else 0) | float }}"
          flow_min: >-
            {%- set ns = namespace(v=0, done=false) -%}{%- set p = fcurve -%}{%- set r = min_rpm -%}{%- for i in range(1, p | count) -%}{%- if not ns.done and (r <= p[i][0] or loop.last) -%}{%- set ns.v = p[i-1][1] + (r - p[i-1][0]) * (p[i][1] - p[i-1][1]) / (p[i][0] - p[i-1][0]) -%}{%- set ns.done = true -%}{%- endif -%}{%- endfor -%}{{ ns.v }}
          active_mode: >-
            {%- if ph_on -%}pH hold
            {%- elif sel == 'Auto' -%}{{ 'Continuous' if (cal_ok and rpm_low >= min_rpm) else 'Microdose' }}
            {%- else -%}{{ sel }}{%- endif -%}
          bolus_n: "{{ [[1, (win_min / 60) | int] | max, 24] | min }}"
          # the tick fires at most one pulse a minute, so a pulse must cover the busiest minute (plus catch-up)
          rate_peak: "{{ ((daily * (weights | max) / sumw) if sumw > 0 else 0) + daily * 0.25 / 360 }}"
          pulse_ml: >-
            {%- if active_mode == 'Bolus' -%}{%- set p = daily / bolus_n -%}
            {%- elif active_mode == 'Microdose' -%}{%- set p = [min_pulse, rate_peak] | max -%}
            {%- elif active_mode == 'pH hold' -%}{%- set p = [min_pulse, ph_mlh / 60] | max -%}
            {%- else -%}{%- set p = 0 -%}{%- endif -%}
            {{ ((p * 10) | round(0, 'ceil')) / 10 if p > 0 else 0 }}
          interval_min: >-
            {%- set rr = rate_plan if ph_on else rate_avg -%}
            {{ (pulse_ml / rr) if (rr > 0 and pulse_ml > 0) else 0 }}
          rpm_raw: >-
            {%- set ns = namespace(r=0, done=false) -%}{%- set p = fcurve -%}{%- set f = rate_plan -%}{%- for i in range(1, p | count) -%}{%- if not ns.done and (f <= p[i][1] or loop.last) -%}{%- set ns.r = p[i-1][0] + (f - p[i-1][1]) * (p[i][0] - p[i-1][0]) / ([p[i][1] - p[i-1][1], 0.0001] | max) -%}{%- set ns.done = true -%}{%- endif -%}{%- endfor -%}{{ ns.r }}
          rpm_now: "{{ ([[rpm_raw, min_rpm] | max, 350] | min) if (cal_ok and rate_plan > 0) else 0 }}"
          flow_now: >-
            {%- set ns = namespace(v=0, done=false) -%}{%- set p = fcurve -%}{%- set r = rpm_now -%}{%- for i in range(1, p | count) -%}{%- if not ns.done and (r <= p[i][0] or loop.last) -%}{%- set ns.v = p[i-1][1] + (r - p[i-1][0]) * (p[i][1] - p[i-1][1]) / (p[i][0] - p[i-1][0]) -%}{%- set ns.done = true -%}{%- endif -%}{%- endfor -%}{{ ns.v }}
          pulse_flow: >-
            {%- set ns = namespace(v=0, done=false) -%}{%- set p = fcurve -%}{%- set r = pulse_rpm -%}{%- for i in range(1, p | count) -%}{%- if not ns.done and (r <= p[i][0] or loop.last) -%}{%- set ns.v = p[i-1][1] + (r - p[i-1][0]) * (p[i][1] - p[i-1][1]) / (p[i][0] - p[i-1][0]) -%}{%- set ns.done = true -%}{%- endif -%}{%- endfor -%}{{ ns.v }}
          today: "{{ states('input_number.sentinel_x1_today_ml') | float(0) }}"
          hour_ml: "{{ states('input_number.sentinel_x1_hour_ml') | float(0) }}"
          container: "{{ states('input_number.sentinel_x1_container_ml') | float(0) }}"
          stop_ml: "{{ states('input_number.sentinel_x1_container_stop_ml') | float(50) }}"
          daily_cap: "{{ ph_mld if ph_on else daily * (states('input_number.sentinel_x1_daily_cap_pct') | float(110)) / 100 }}"
          hourly_cap: "{{ (ph_mlh + pulse_ml) if ph_on else [maxhour * (states('input_number.sentinel_x1_hourly_cap_x') | float(1.5)), pulse_ml * 2] | max + daily * 0.25 / 6 }}"
          pause_on: "{{ as_timestamp(states('input_datetime.sentinel_x1_pause_until'), 0) > as_timestamp(now()) }}"
          kind: "{{ states('input_select.sentinel_x1_pause_kind') }}"
          sc_feed: "{{ expand(['binary_sensor.sentinel_controller_feed_pause_1', 'binary_sensor.sentinel_controller_feed_pause_2', 'binary_sensor.sentinel_controller_feed_pause_3', 'binary_sensor.sentinel_controller_feed_pause_4']) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
          sc_maint: "{{ expand(['binary_sensor.sentinel_controller_maintenance_1', 'binary_sensor.sentinel_controller_maintenance_2', 'binary_sensor.sentinel_controller_maintenance_3', 'binary_sensor.sentinel_controller_maintenance_4']) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
          feed_block: "{{ (pause_on and kind == 'Feed') or sc_feed }}"
          mnt_block: "{{ (pause_on and kind == 'Maintenance') or sc_maint }}"
          awc_block: "{{ is_state('binary_sensor.sentinel_controller_water_change', 'on') }}"
          man_block: "{{ false }}"
          ret_e: "{{ states('input_text.sentinel_x1_return_entity') | trim }}"
          ret_block: "{{ ret_e not in ['', 'unknown', 'unavailable'] and states(ret_e) == 'off' }}"
          pump: "{{ states('sensor.kamoer_x1_pro_t_kamoer_status') }}"
          block: >-
            {%- if not en -%}Disabled
            {%- elif daily <= 0 and not ph_on -%}No daily volume
            {%- elif is_state('input_boolean.sentinel_x1_calibrating', 'on') -%}Calibrating
            {%- elif not cal_ok -%}Needs calibration
            {%- elif pump in ['offline', 'error', 'unavailable', 'unknown'] -%}Pump {{ pump }}
            {%- elif is_state('binary_sensor.kamoer_x1_pro_t_kamoer_pulse_fault', 'on') -%}Pump fault: pulse overran
            {%- elif is_state('input_boolean.sentinel_x1_ph_trip', 'on') -%}pH above alarm limit
            {%- elif is_state('input_boolean.sentinel_x1_kh_trip', 'on') -%}KH above ceiling
                        {%- elif container <= stop_ml -%}Container empty
            {%- elif ph_on and kh_now > ph_kh_max -%}KH above pH-hold limit
            {%- elif ret_block -%}Return pump off
            {%- elif awc_block -%}Water change
            {%- elif mnt_block -%}Maintenance
            {%- elif feed_block -%}Feeding pause
            {%- elif man_block -%}Manual pause
            {%- elif not in_win and not ph_on -%}Outside window
            {%- elif today >= daily_cap -%}Daily ceiling reached
            {%- elif hour_ml >= hourly_cap -%}Hourly ceiling reached
            {%- else -%}{%- endif -%}
    sensor:
      - name: Sentinel X1 Engine
        unique_id: sentinel_x1_engine
        icon: mdi:water-pump
        state: "{{ ('Paused' if block else active_mode) | trim }}"
        attributes:
          active_mode: "{{ active_mode | trim }}"
          block: "{{ block | trim }}"
          catchup_ok: "{{ not ph_on and (block | trim) in ['Feeding pause', 'Manual pause'] and is_state('input_select.sentinel_x1_missed', 'Catch up over 6 h') }}"
          ph_on: "{{ ph_on }}"
          ph_rate_ml_h: "{{ (ph_rate * 60) | round(2) }}"
          pulse_ml: "{{ pulse_ml }}"
          pulse_floor: "{{ pulse_floor | round(3) }}"
          min_pulse_eff: "{{ min_pulse }}"
          interval_min: "{{ interval_min | round(2) }}"
          rpm_now: "{{ rpm_now | round(0) }}"
          rate_plan: "{{ rate_plan | round(5) }}"
          rate_avg: "{{ rate_avg | round(5) }}"
          flow_curve: "{{ fcurve }}"
          cal_ok: "{{ cal_ok }}"
          pulse_flow: "{{ pulse_flow | round(4) }}"
          pulse_rpm: "{{ pulse_rpm }}"
          min_rpm: "{{ min_rpm }}"
          daily: "{{ daily | round(2) }}"
          window_minutes: "{{ win_min }}"
          in_window: "{{ in_win }}"
          daily_cap: "{{ daily_cap | round(2) }}"
          hourly_cap: "{{ hourly_cap | round(2) }}"
          hour_plan: "{{ hour_min }}"
          weights: "{{ weights }}"
          summary: >-
            {%- set m = active_mode | trim -%}
            {%- if not cal_ok -%}Calibrate on the Settings tab to start
            {%- elif m == 'pH hold' -%}{{ 'At or above target, waiting' if ph_rate <= 0 else '%.1f mL every %.1f min (%.1f mL/h)' | format(pulse_ml, interval_min, ph_rate * 60) }}
            {%- elif m == 'Continuous' -%}Continuous at {{ flow_now | round(2) }} mL/min
            {%- elif m == 'Microdose' -%}{{ '%.1f' | format(pulse_ml) }} mL every {{ interval_min | round(1) }} min
            {%- else -%}{{ '%.1f' | format(pulse_ml) }} mL × {{ bolus_n }} per day{%- endif -%}
          why: >-
            {%- set m = active_mode | trim -%}
            {%- if not cal_ok -%}Set the calibration on the Settings tab: the engine needs mL per minute to size doses.
            {%- elif m == 'pH hold' -%}pH {{ ph_v }} vs target {{ ph_t }}. Kalk rate scales from 0 at target to {{ ph_mlh }} mL/h at 0.10 below it.
            {%- elif sel == 'Auto' and m == 'Continuous' -%}Slowest planned hour needs {{ flow_low | round(2) }} mL/min, at or above the {{ flow_min | round(1) }} mL/min minimum, so the pump runs without stopping.
            {%- elif sel == 'Auto' -%}Slowest planned hour needs {{ flow_low | round(2) }} mL/min, below the {{ flow_min | round(1) }} mL/min minimum, so the engine pulses the smallest accurate dose instead.
            {%- elif m == 'Continuous' and rpm_low < min_rpm -%}Forced continuous: some hours need less than {{ flow_min | round(1) }} mL/min and will run at the minimum (overdelivery is held by the caps).
            {%- elif m == 'Bolus' -%}Forced bolus: fewer, larger additions.
            {%- else -%}Forced {{ m | lower }}.{%- endif -%}
          window_text: >-
            {%- if win24 or s0 == s1 -%}24 hours
            {%- else -%}{{ states('input_datetime.sentinel_x1_start')[:5] }}–{{ states('input_datetime.sentinel_x1_stop')[:5] }}{{ ' (overnight)' if s1 < s0 else '' }} · {{ (win_min / 60) | round(1) }} h{%- endif -%}
          days_left: >-
            {%- set el = (now().hour * 60 + now().minute) / 1440 -%}
            {%- set use = (today / el) if (ph_on and el > 0.08 and today > 0) else daily -%}
            {{ (container / use) | round(1) if use > 0 else -1 }}
          pause_kind: "{{ kind if pause_on else 'Off' }}"
          pause_left_min: "{{ (((as_timestamp(states('input_datetime.sentinel_x1_pause_until'), 0) - as_timestamp(now())) / 60) | round(0, 'ceil')) | int if pause_on else 0 }}"

  - sensor:
      - name: Sentinel X1 Today percent
        unique_id: sentinel_x1_today_pct
        unit_of_measurement: "%"
        icon: mdi:water-percent
        state: >-
          {%- set d = states('input_number.sentinel_x1_effective_ml') | float(0) -%}
          {{ ((states('input_number.sentinel_x1_today_ml') | float(0)) / d * 100) | round(0) if d > 0 else 0 }}
      - name: Sentinel X1 Container days
        unique_id: sentinel_x1_container_days
        unit_of_measurement: d
        icon: mdi:calendar-clock
        # unavailable while not dosing (no usage rate) or while the engine reloads, so a
        # missing/zero rate can't read as "0 days left" and trip the container-low alert
        availability: "{{ is_state('input_boolean.sentinel_x1_enabled', 'on') and state_attr('sensor.sentinel_x1_engine', 'days_left') | float(-1) >= 0 }}"
        state: "{{ state_attr('sensor.sentinel_x1_engine', 'days_left') | float(0) }}"
      - name: Sentinel X1 Container percent
        unique_id: sentinel_x1_container_pct
        unit_of_measurement: "%"
        icon: mdi:bottle-tonic-outline
        state: >-
          {%- set s = states('input_number.sentinel_x1_container_size') | float(0) -%}
          {{ ((states('input_number.sentinel_x1_container_ml') | float(0)) / s * 100) | round(0) if s > 0 else 0 }}
      - name: Sentinel X1 Tubing percent
        unique_id: sentinel_x1_tube_pct
        unit_of_measurement: "%"
        icon: mdi:timer-sand
        state: >-
          {%- set l = states('input_number.sentinel_x1_tube_life') | float(2000) -%}
          {{ ((states('input_number.sentinel_x1_tube_hours') | float(0)) / l * 100) | round(1) }}
      - name: Sentinel X1 Calibration age
        unique_id: sentinel_x1_cal_age
        unit_of_measurement: d
        icon: mdi:beaker-question
        state: >-
          {%- set d = states('input_datetime.sentinel_x1_last_cal') -%}
          {{ ((now().date() - strptime(d, '%Y-%m-%d').date()).days) if d not in ['unknown', 'unavailable', ''] else 999 }}
      - name: Sentinel X1 pH
        unique_id: sentinel_x1_ph
        icon: mdi:ph
        state: >-
          {%- set e = states('input_text.sentinel_x1_ph_entity') | trim -%}
          {{ states(e) if e else 'not set' }}

  # ---- KH reading used by auto-tune: newest of the chosen sensor and the last manual test ----
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - input_text.sentinel_x1_kh_entity
          - input_number.sentinel_x1_kh_manual
          - input_datetime.sentinel_x1_kh_manual_at
          - input_select.sentinel_x1_kh_product
          - input_number.sentinel_x1_tank_volume
          - input_select.sentinel_x1_volume_unit
          - input_number.sentinel_x1_kh_custom_strength
    action:
      - variables:
          src: "{{ states('input_text.sentinel_x1_kh_entity') | trim }}"
          man_v: "{{ states('input_number.sentinel_x1_kh_manual') | float(0) }}"
          man_t: "{{ as_timestamp(states('input_datetime.sentinel_x1_kh_manual_at'), 0) }}"
          sen_v: >-
            {%- set l = expand(src) if src not in ['', 'manual'] else [] -%}
            {{ l[0].state | float(0) if (l | count > 0 and l[0].state | is_number) else 0 }}
          sen_t: >-
            {%- set l = expand(src) if src not in ['', 'manual'] else [] -%}
            {{ as_timestamp(l[0].last_updated) if (l | count > 0 and l[0].state | is_number) else 0 }}
          use_man: "{{ man_v > 0 and man_t >= sen_t }}"
          kh: "{{ man_v if use_man else sen_v }}"
          t: "{{ man_t if use_man else sen_t }}"
          age_h: "{{ ((as_timestamp(now()) - t) / 3600) | round(1) if t > 0 else 999 }}"
          valid: "{{ kh >= 3 and kh <= 20 and age_h <= (24 if use_man else 12) }}"
          prod: "{{ states('input_select.sentinel_x1_kh_product') }}"
          table: "{{ {'Saturated kalkwasser': [0.0011, 0], 'Red Sea Reef Foundation B': [0.1, 0], 'ESV B-Ionic Component 1': [0.0784, 26.4], 'Fritz RPM Part 1': [0.0795, 13.2], 'Brightwell Reef Code B': [0.084, 13.2], 'Brightwell Alkalin8.3': [0.053, 0], 'BRS Pharma Soda Ash (1 gal mix)': [0.053, 0], 'BRS Pharma Sodium Bicarbonate (1 gal mix)': [0.0265, 0], 'Tropic Marin All-For-Reef': [0.056, 25], 'Aquaforest Component 2+': [0.026, 0], 'Aquaforest Component 2 Pro': [0.052, 0], 'Aquaforest KH Plus': [0.05, 10], 'Seachem Reef Carbonate': [0.112, 25], 'Seachem Reef Fusion 2': [0.123, 16], 'Simple Science Alkalinity Part C': [0.0556, 0]} }}"
          row: "{{ table.get(prod, [0, 0]) }}"
          S: "{{ (states('input_number.sentinel_x1_kh_custom_strength') | float(0)) if prod == 'Custom' else row[0] }}"
          vol_l: "{{ (states('input_number.sentinel_x1_tank_volume') | float(0)) * (3.78541 if is_state('input_select.sentinel_x1_volume_unit', 'US gal') else 1) }}"
          k: "{{ (S * 100 / vol_l) if vol_l > 0 else 0 }}"
          maxml: "{{ (row[1] * vol_l / 100) if (row[1] > 0 and prod != 'Custom') else 0 }}"
    sensor:
      - name: Sentinel X1 KH
        unique_id: sentinel_x1_kh
        unit_of_measurement: dKH
        icon: mdi:test-tube
        state: "{{ kh | round(2) if kh > 0 else none }}"
        attributes:
          valid: "{{ valid }}"
          from: "{{ 'manual test' if use_man else src }}"
          age_h: "{{ age_h }}"
          product: "{{ prod }}"
          strength: "{{ S }}"
          volume_l: "{{ vol_l | round(1) }}"
          k: "{{ k | round(7) }}"
          ml_per_dkh: "{{ (1 / k) | round(1) if k > 0 else 0 }}"
          max_ml_day: "{{ maxml | round(1) }}"

# =====================================================================
#  AUTOMATIONS
# =====================================================================
automation:
  # ---- the tick: runs at :30 s every minute, after the engine updates ----
  - id: sentinel_x1_tick
    alias: Sentinel X1 · Tick
    mode: single
    max_exceeded: silent
    trigger:
      - platform: time_pattern
        seconds: "30"
    variables:
      e: sensor.sentinel_x1_engine
      block: "{{ state_attr(e, 'block') | string | trim if state_attr(e, 'block') else '' }}"
      mode: "{{ state_attr(e, 'active_mode') }}"
      rate: "{{ state_attr(e, 'rate_plan') | float(0) }}"
      pulse: "{{ state_attr(e, 'pulse_ml') | float(0) }}"
      fcurve: "{{ state_attr(e, 'flow_curve') or [[0, 0]] }}"
      pulse_flow: "{{ state_attr(e, 'pulse_flow') | float(0) }}"
      min_rpm: "{{ state_attr(e, 'min_rpm') | float(30) }}"
      pulse_rpm: "{{ state_attr(e, 'pulse_rpm') | float(200) }}"
      daily: "{{ state_attr(e, 'daily') | float(0) }}"
      catchup_ok: "{{ state_attr(e, 'catchup_ok') | bool(false) }}"
      owed: "{{ states('input_number.sentinel_x1_owed_ml') | float(0) }}"
      debt: "{{ states('input_number.sentinel_x1_debt_ml') | float(0) }}"
      today: "{{ states('input_number.sentinel_x1_today_ml') | float(0) }}"
      hour_ml: "{{ 0 if now().minute == 0 else states('input_number.sentinel_x1_hour_ml') | float(0) }}"
      container: "{{ states('input_number.sentinel_x1_container_ml') | float(0) }}"
      tube: "{{ states('input_number.sentinel_x1_tube_hours') | float(0) }}"
      cont_on: "{{ is_state('switch.kamoer_x1_pro_t_kamoer_continuous', 'on') }}"
      transfer: "{{ ([debt, daily * 0.25 / 360] | min) if block == '' else 0 }}"
      rpm_raw: >-
        {%- set ns = namespace(r=0, done=false) -%}{%- set p = fcurve -%}{%- set f = (rate + transfer) -%}{%- for i in range(1, p | count) -%}{%- if not ns.done and (f <= p[i][1] or loop.last) -%}{%- set ns.r = p[i-1][0] + (f - p[i-1][1]) * (p[i][0] - p[i-1][0]) / ([p[i][1] - p[i-1][1], 0.0001] | max) -%}{%- set ns.done = true -%}{%- endif -%}{%- endfor -%}{{ ns.r }}
      rpm_cmd: "{{ ([[rpm_raw, min_rpm] | max, 350] | min) | round(0) if fcurve | count >= 2 else 0 }}"
      flow_cmd: >-
        {%- set ns = namespace(v=0, done=false) -%}{%- set p = fcurve -%}{%- set r = rpm_cmd -%}{%- for i in range(1, p | count) -%}{%- if not ns.done and (r <= p[i][0] or loop.last) -%}{%- set ns.v = p[i-1][1] + (r - p[i-1][0]) * (p[i][1] - p[i-1][1]) / (p[i][0] - p[i-1][0]) -%}{%- set ns.done = true -%}{%- endif -%}{%- endfor -%}{{ ns.v }}
      speed_now: "{{ states('number.kamoer_x1_pro_t_kamoer_speed') | float(0) }}"
      flow_prev: >-
        {%- set ns = namespace(v=0, done=false) -%}{%- set p = fcurve -%}{%- set r = speed_now -%}{%- for i in range(1, p | count) -%}{%- if not ns.done and (r <= p[i][0] or loop.last) -%}{%- set ns.v = p[i-1][1] + (r - p[i-1][0]) * (p[i][1] - p[i-1][1]) / (p[i][0] - p[i-1][0]) -%}{%- set ns.done = true -%}{%- endif -%}{%- endfor -%}{{ [ns.v, 0] | max }}
      last_min: "{{ flow_prev if (cont_on and is_state('input_boolean.sentinel_x1_calibrating', 'off')) else 0 }}"
    action:
      - if: "{{ now().minute == 0 }}"
        then:
          - service: input_number.set_value
            target: { entity_id: input_number.sentinel_x1_hour_ml }
            data: { value: 0 }
      - choose:
          # ---------- paused ----------
          - conditions: "{{ block != '' }}"
            sequence:
              - if: "{{ cont_on and is_state('input_boolean.sentinel_x1_calibrating', 'off') }}"
                then:
                  - service: switch.turn_off
                    target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
                  - service: script.sentinel_x1_count
                    data: { ml: "{{ last_min }}", hours: "{{ 1 / 60 }}" }
              - if: "{{ catchup_ok and rate > 0 }}"
                then:
                  - service: input_number.set_value
                    target: { entity_id: input_number.sentinel_x1_debt_ml }
                    data:
                      value: "{{ ([debt + rate, daily * 0.25] | min) | round(3) }}"
          # ---------- continuous ----------
          - conditions: "{{ mode == 'Continuous' }}"
            sequence:
              - variables:
                  ml: "{{ flow_prev if cont_on else 0 }}"
              - if: "{{ (not cont_on) or (speed_now - rpm_cmd) | abs >= 1 or now().minute % 20 == 0 }}"
                then:
                  - service: number.set_value
                    target: { entity_id: number.kamoer_x1_pro_t_kamoer_speed }
                    data: { value: "{{ rpm_cmd }}" }
              - if: "{{ not cont_on }}"
                then:
                  - delay: { seconds: 1 }
                  - service: switch.turn_on
                    target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
              - service: input_number.set_value
                target: { entity_id: input_number.sentinel_x1_today_ml }
                data: { value: "{{ (today + ml) | round(3) }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.sentinel_x1_hour_ml }
                data: { value: "{{ (hour_ml + ml) | round(3) }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.sentinel_x1_container_ml }
                data: { value: "{{ ([container - ml, 0] | max) | round(1) }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.sentinel_x1_tube_hours }
                data: { value: "{{ (tube + (1 / 60 if cont_on else 0)) | round(3) }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.sentinel_x1_debt_ml }
                data: { value: "{{ ([debt - (transfer if cont_on else 0), 0] | max) | round(3) }}" }
        # ---------- microdose / bolus ----------
        default:
          - if: "{{ cont_on and is_state('input_boolean.sentinel_x1_calibrating', 'off') }}"
            then:
              - service: switch.turn_off
                target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
              - service: script.sentinel_x1_count
                data: { ml: "{{ last_min }}", hours: "{{ 1 / 60 }}" }
              - delay: { seconds: 1 }
          - variables:
              acc: "{{ owed + rate + transfer }}"
              fire: "{{ pulse > 0 and acc >= pulse }}"
              today: "{{ states('input_number.sentinel_x1_today_ml') | float(0) }}"
              hour_ml: "{{ 0 if now().minute == 0 else states('input_number.sentinel_x1_hour_ml') | float(0) }}"
              container: "{{ states('input_number.sentinel_x1_container_ml') | float(0) }}"
              tube: "{{ states('input_number.sentinel_x1_tube_hours') | float(0) }}"
          - if: "{{ fire }}"
            then:
              - service: number.set_value
                target: { entity_id: number.kamoer_x1_pro_t_kamoer_speed }
                data: { value: "{{ pulse_rpm }}" }
              - service: number.set_value
                target: { entity_id: number.kamoer_x1_pro_t_kamoer_dose_volume }
                data: { value: "{{ pulse }}" }
              - delay: { milliseconds: 500 }
              - service: button.press
                target: { entity_id: button.kamoer_x1_pro_t_kamoer_dose_now }
              - service: input_number.set_value
                target: { entity_id: input_number.sentinel_x1_today_ml }
                data: { value: "{{ (today + pulse) | round(3) }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.sentinel_x1_hour_ml }
                data: { value: "{{ (hour_ml + pulse) | round(3) }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.sentinel_x1_container_ml }
                data: { value: "{{ ([container - pulse, 0] | max) | round(1) }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.sentinel_x1_tube_hours }
                data: { value: "{{ (tube + (pulse / pulse_flow / 60 if pulse_flow > 0 else 0)) | round(4) }}" }
          - service: input_number.set_value
            target: { entity_id: input_number.sentinel_x1_owed_ml }
            data: { value: "{{ ([(acc - pulse) if fire else acc, 0] | max) | round(4) }}" }
          - service: input_number.set_value
            target: { entity_id: input_number.sentinel_x1_debt_ml }
            data: { value: "{{ ([debt - transfer, 0] | max) | round(3) }}" }

  # ---- midnight: reset counter, ramp the daily volume toward the target ----
  - id: sentinel_x1_midnight
    alias: Sentinel X1 · Midnight rollover and ramp
    trigger:
      - platform: time
        at: "00:00:05"
    variables:
      tgt: "{{ states('input_number.sentinel_x1_target_ml') | float(0) }}"
      eff: "{{ states('input_number.sentinel_x1_effective_ml') | float(0) }}"
      step: "{{ [eff * 0.05, 0.5] | max }}"
      new: >-
        {%- if is_state('input_boolean.sentinel_x1_ramp', 'off') or eff <= 0 -%}{{ tgt }}
        {%- elif tgt > eff -%}{{ [tgt, eff + step] | min }}
        {%- else -%}{{ [tgt, eff - step] | max }}{%- endif -%}
    action:
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_today_ml }
        data: { value: 0 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_effective_ml }
        data: { value: "{{ new | float | round(2) }}" }

  # ---- target changed: apply now if ramp is off or nothing is running yet ----
  - id: sentinel_x1_target_changed
    alias: Sentinel X1 · Target changed
    trigger:
      - platform: state
        entity_id: [input_number.sentinel_x1_target_ml, input_boolean.sentinel_x1_ramp]
    condition: >-
      {{ is_state('input_boolean.sentinel_x1_ramp', 'off')
         or states('input_number.sentinel_x1_effective_ml') | float(0) <= 0 }}
    action:
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_effective_ml }
        data: { value: "{{ states('input_number.sentinel_x1_target_ml') | float(0) }}" }

  # ---- calibration changed on the dashboard: stamp the date, reset reminder ----
  - id: sentinel_x1_cal_changed
    alias: Sentinel X1 · Calibration changed
    trigger:
      - platform: state
        entity_id:
          - number.kamoer_x1_pro_t_kamoer_cal_low_speed
          - number.kamoer_x1_pro_t_kamoer_cal_low
          - number.kamoer_x1_pro_t_kamoer_cal_200_rpm
          - number.kamoer_x1_pro_t_kamoer_cal_350_rpm
          - number.kamoer_x1_pro_t_kamoer_pulse_factor
    condition: "{{ trigger.from_state is not none and trigger.from_state.state not in ['unknown', 'unavailable'] and trigger.to_state.state not in ['unknown', 'unavailable'] and is_state('script.sentinel_x1_cal_clear', 'off') }}"
    action:
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.sentinel_x1_last_cal }
        data: { date: "{{ now().date() }}" }
      - service: input_boolean.turn_off
        target: { entity_id: [input_boolean.sentinel_x1_cal_reminded, input_boolean.sentinel_x1_cal_reminder_dismissed] }
      - service: persistent_notification.dismiss
        data: { notification_id: sentinel_x1_cal_reminder }

  # ---- low-speed run entered as mL in 5 min: store as mL/min on the bridge ----
  - id: sentinel_x1_cal_low_entered
    alias: Sentinel X1 · Low-speed calibration entered
    trigger:
      - platform: state
        entity_id: input_number.sentinel_x1_cal_low_collected
    condition: "{{ trigger.to_state.state | float(0) > 0 and trigger.from_state is not none }}"
    action:
      - service: number.set_value
        target: { entity_id: number.kamoer_x1_pro_t_kamoer_cal_low }
        data: { value: "{{ (trigger.to_state.state | float(0) / 5) | round(3) }}" }

  # ---- pulse check: result is applied only by script.sentinel_x1_pulse_save (Save button) ----

  # ---- a calibration run ended while the schedule is off for calibration: ask to restart ----
  - id: sentinel_x1_cal_ended_ask
    alias: Sentinel X1 · Calibration run ended, ask to restart schedule
    trigger:
      - platform: state
        entity_id: [script.sentinel_x1_cal_run_low, script.sentinel_x1_cal_run_mid, script.sentinel_x1_cal_run_high, script.sentinel_x1_cal_run_pulses, script.sentinel_x1_test_run]
        from: "on"
        to: "off"
    condition:
      - condition: state
        entity_id: input_boolean.sentinel_x1_cal_paused
        state: "on"
      - condition: state
        entity_id: input_boolean.sentinel_x1_enabled
        state: "off"
    action:
      - service: input_boolean.turn_on
        target: { entity_id: input_boolean.sentinel_x1_cal_ask_restart }
      # an unanswered prompt counts as No: the reminder still fires
      - service: timer.start
        target: { entity_id: timer.sentinel_x1_sched_alert }
        data: { duration: "00:15:00" }

  # ---- schedule still off: alert, then every 30 min until acknowledged or restarted ----
  - id: sentinel_x1_sched_off_alert
    alias: Sentinel X1 · Schedule-off reminder
    trigger:
      - platform: event
        event_type: timer.finished
        event_data: { entity_id: timer.sentinel_x1_sched_alert }
    condition:
      - condition: state
        entity_id: input_boolean.sentinel_x1_enabled
        state: "off"
      - condition: state
        entity_id: input_boolean.sentinel_x1_calibrating
        state: "off"
    action:
      - service: script.sentinel_x1_alert
        data:
          title: Dosing schedule is off
          message: >-
            Sentinel X1 dosing was turned off for calibration and is still off.
            Restart it or acknowledge on the Sentinel X1 page. Next reminder in 30 minutes.
      - service: timer.start
        target: { entity_id: timer.sentinel_x1_sched_alert }
        data: { duration: "00:30:00" }

  # ---- schedule turned back on (any way): clear the calibration prompt and reminders ----
  - id: sentinel_x1_sched_on_clear
    alias: Sentinel X1 · Schedule on, clear calibration reminders
    trigger:
      - platform: state
        entity_id: input_boolean.sentinel_x1_enabled
        to: "on"
    action:
      - service: timer.cancel
        target: { entity_id: timer.sentinel_x1_sched_alert }
      - service: input_boolean.turn_off
        target: { entity_id: [input_boolean.sentinel_x1_cal_paused, input_boolean.sentinel_x1_cal_ask_restart] }
      - service: persistent_notification.dismiss
        data: { notification_id: sentinel_x1_dosing_schedule_is_off }

  # ---- pause timer: keep the Sentinel Controller pause alive, end on time ----
  - id: sentinel_x1_pause_timer
    alias: Sentinel X1 · Pause timer
    mode: single
    max_exceeded: silent
    trigger:
      - platform: time_pattern
        seconds: "15"
    variables:
      kind: "{{ states('input_select.sentinel_x1_pause_kind') }}"
      left: "{{ as_timestamp(states('input_datetime.sentinel_x1_pause_until'), 0) - as_timestamp(now()) }}"
      n: "{{ states('input_number.sentinel_x1_feed_n' if kind == 'Feed' else 'input_number.sentinel_x1_maint_n') | int(1) }}"
    condition: "{{ kind in ['Feed', 'Maintenance'] }}"
    action:
      - choose:
          - conditions: "{{ left <= 0 }}"
            sequence:
              - service: script.sentinel_x1_resume
        default:
          - service: "sentinel_controller.{{ 'start_feed_pause' if kind == 'Feed' else 'start_maintenance' }}"
            continue_on_error: true
            data: { n: "{{ n }}" }

  # ---- pause stopped from Sentinel Controller: end the X1 pause too ----
  - id: sentinel_x1_pause_external_stop
    alias: Sentinel X1 · Pause stopped in Sentinel Controller
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.sentinel_controller_feed_pause_1
          - binary_sensor.sentinel_controller_feed_pause_2
          - binary_sensor.sentinel_controller_feed_pause_3
          - binary_sensor.sentinel_controller_feed_pause_4
          - binary_sensor.sentinel_controller_maintenance_1
          - binary_sensor.sentinel_controller_maintenance_2
          - binary_sensor.sentinel_controller_maintenance_3
          - binary_sensor.sentinel_controller_maintenance_4
        from: "on"
        to: "off"
    condition: >-
      {% set k = states('input_select.sentinel_x1_pause_kind') %}
      {{ (k == 'Feed' and trigger.entity_id == 'binary_sensor.sentinel_controller_feed_pause_' ~ (states('input_number.sentinel_x1_feed_n') | int(1)))
         or (k == 'Maintenance' and trigger.entity_id == 'binary_sensor.sentinel_controller_maintenance_' ~ (states('input_number.sentinel_x1_maint_n') | int(1))) }}
    action:
      - service: script.sentinel_x1_resume

  # ---- alert target dropdown: list phones/devices with the HA app, plus Pushover ----
  - id: sentinel_x1_notify_options
    alias: Sentinel X1 · Alert target list
    mode: queued
    trigger:
      - platform: homeassistant
        event: start
      - platform: event
        event_type: automation_reloaded
      - platform: time
        at: "03:10:00"
    variables:
      opts: >-
        {%- set ns = namespace(o=['Not used']) -%}
        {%- for e in integration_entities('mobile_app') -%}
          {%- set n = device_attr(device_id(e), 'name') -%}
          {%- if n and n not in ns.o -%}{%- set ns.o = ns.o + [n] -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.o + ['Pushover'] }}
      stored: "{{ states('input_text.sentinel_x1_notify') | trim }}"
      pick: >-
        {%- set ns = namespace(p='Not used') -%}
        {%- for o in opts -%}
          {%- if (o == 'Pushover' and stored == 'notify.pushover') or ('notify.mobile_app_' ~ (o | slugify)) == stored -%}{%- set ns.p = o -%}{%- endif -%}
        {%- endfor -%}
        {{ ns.p }}
    action:
      - service: input_select.set_options
        target: { entity_id: input_select.sentinel_x1_notify_target }
        data: { options: "{{ opts }}" }
      - service: input_select.select_option
        target: { entity_id: input_select.sentinel_x1_notify_target }
        data: { option: "{{ pick }}" }

  - id: sentinel_x1_notify_chosen
    alias: Sentinel X1 · Alert target chosen
    trigger:
      - platform: state
        entity_id: input_select.sentinel_x1_notify_target
    condition: "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"
    action:
      - service: input_text.set_value
        target: { entity_id: input_text.sentinel_x1_notify }
        data:
          value: >-
            {%- set o = trigger.to_state.state -%}
            {%- if o in ['None', 'Not used'] -%}{{ ' ' }}
            {%- elif o == 'Pushover' -%}notify.pushover
            {%- else -%}notify.mobile_app_{{ o | slugify }}{%- endif -%}

  # ---- pH alarm: alert only, never changes dosing ----
  - id: sentinel_x1_ph_hold
    alias: Sentinel X1 · pH alarm
    mode: queued
    trigger:
      - platform: template
        value_template: >-
          {%- set v = states('sensor.sentinel_x1_ph') | float(0) -%}
          {{ v > 0 and v > states('input_number.sentinel_x1_ph_stop') | float(99) }}
        for: { minutes: 5 }
        id: high
      - platform: template
        value_template: >-
          {%- set v = states('sensor.sentinel_x1_ph') | float(0) -%}
          {{ v > 0 and v < states('input_number.sentinel_x1_ph_resume') | float(0) }}
        for: { minutes: 5 }
        id: low
    action:
      - service: script.sentinel_x1_alert
        data:
          title: "Sentinel X1 pH alarm"
          message: >-
            pH is {{ states('sensor.sentinel_x1_ph') }}, {{ 'above' if trigger.id == 'high' else 'below' }} the alarm
            {{ states('input_number.sentinel_x1_ph_stop') if trigger.id == 'high' else states('input_number.sentinel_x1_ph_resume') }}.
            {{ 'Dosing paused until pH has been back under the limit for 30 minutes.' if trigger.id == 'high' else 'Alert only: dosing is not changed.' }}
      - if: "{{ trigger.id == 'high' }}"
        then:
          - service: input_boolean.turn_on
            target: { entity_id: input_boolean.sentinel_x1_ph_trip }

  # ---- overdose guard: pH back under the limit for 30 min -> resume ----
  - id: sentinel_x1_ph_trip_clear
    alias: Sentinel X1 · pH back under limit, resume dosing
    trigger:
      - platform: template
        value_template: >-
          {%- set v = states('sensor.sentinel_x1_ph') | float(0) -%}
          {{ v > 0 and v <= states('input_number.sentinel_x1_ph_stop') | float(99) - 0.05 }}
        for: { minutes: 30 }
    condition:
      - condition: state
        entity_id: input_boolean.sentinel_x1_ph_trip
        state: "on"
    action:
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_ph_trip }
      - service: script.sentinel_x1_alert
        data:
          title: Sentinel X1 dosing resumed
          message: "pH {{ states('sensor.sentinel_x1_ph') }} has been under the {{ states('input_number.sentinel_x1_ph_stop') }} limit for 30 minutes."

  # ---- overdose guard: KH above target + max rise -> pause; back under -> resume ----
  - id: sentinel_x1_kh_trip
    alias: Sentinel X1 · KH ceiling
    mode: queued
    trigger:
      - platform: state
        entity_id: sensor.sentinel_x1_kh
      - platform: state
        entity_id: [input_number.sentinel_x1_kh_target, input_number.sentinel_x1_kh_max_rise]
    variables:
      kh: "{{ states('sensor.sentinel_x1_kh') | float(0) }}"
      valid: "{{ state_attr('sensor.sentinel_x1_kh', 'valid') | bool(false) }}"
      ceiling: "{{ states('input_number.sentinel_x1_kh_target') | float(99) + states('input_number.sentinel_x1_kh_max_rise') | float(0.5) }}"
      over: "{{ valid and kh > 0 and kh > ceiling }}"
    action:
      - choose:
          - conditions: "{{ over and is_state('input_boolean.sentinel_x1_kh_trip', 'off') }}"
            sequence:
              - service: input_boolean.turn_on
                target: { entity_id: input_boolean.sentinel_x1_kh_trip }
              - service: script.sentinel_x1_alert
                data:
                  title: Sentinel X1 paused, KH high
                  message: "KH {{ kh }} dKH is above the {{ ceiling | round(2) }} dKH ceiling (target + max rise per day). Dosing paused until a KH reading is back under it."
          - conditions: "{{ not over and kh > 0 and is_state('input_boolean.sentinel_x1_kh_trip', 'on') }}"
            sequence:
              - service: input_boolean.turn_off
                target: { entity_id: input_boolean.sentinel_x1_kh_trip }
              - service: script.sentinel_x1_alert
                data:
                  title: Sentinel X1 dosing resumed
                  message: "KH {{ kh }} dKH is back under the {{ ceiling | round(2) }} dKH ceiling."

  # ---- overdose guard: bridge latched a pulse fault -> engine pauses (block) and alert ----
  - id: sentinel_x1_pulse_fault
    alias: Sentinel X1 · Pulse fault
    trigger:
      - platform: state
        entity_id: binary_sensor.kamoer_x1_pro_t_kamoer_pulse_fault
        to: "on"
    action:
      - service: script.sentinel_x1_alert
        data:
          title: Sentinel X1 pump fault
          message: >-
            {%- set a = trigger.to_state.attributes -%}
            {{ a.reason | default('fault') | capitalize }}{% if a.on_s is defined %}: ran {{ a.on_s }} s against {{ a.planned_s }} s planned ({{ a.ratio }}x){% endif %}.
            All dosing is stopped until you clear the fault on the Sentinel X1 page.

  # ---- pH hold switched on/off ----
  - id: sentinel_x1_ph_hold_switched
    alias: Sentinel X1 · pH hold switched
    trigger:
      - platform: state
        entity_id: input_boolean.sentinel_x1_ph_hold
        to: ["on", "off"]
    action:
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_ph_fallback }
      - service: input_text.set_value
        target: { entity_id: input_text.sentinel_x1_ph_fallback_why }
        data: { value: " " }
      - service: input_number.set_value
        target: { entity_id: [input_number.sentinel_x1_ph_streak_h, input_number.sentinel_x1_ph_streak_ml] }
        data: { value: 0 }
      - if: "{{ trigger.to_state.state == 'on' }}"
        then:
          - if: "{{ not is_state('input_select.sentinel_x1_kh_product', 'Saturated kalkwasser') }}"
            then:
              - service: input_boolean.turn_off
                target: { entity_id: input_boolean.sentinel_x1_ph_hold }
              - service: script.sentinel_x1_alert
                data:
                  title: "Sentinel X1 pH hold"
                  message: "pH hold only works with Saturated kalkwasser. Pick it as the alkalinity product under Tank & product on the Status tab, then switch pH hold on."
              - stop: not kalk
          - if: "{{ is_state('input_boolean.sentinel_x1_kh_enabled', 'on') }}"
            then:
              - service: input_boolean.turn_off
                target: { entity_id: input_boolean.sentinel_x1_kh_enabled }
          - service: input_number.set_value
            target: { entity_id: input_number.sentinel_x1_ph_hr_start }
            data: { value: "{{ states('sensor.sentinel_x1_ph') | float(0) }}" }

  # ---- pH hold guard: probe failure or an implausible pH response -> fall back to the daily plan ----
  - id: sentinel_x1_ph_guard
    alias: Sentinel X1 · pH hold guard
    mode: queued
    trigger:
      - platform: time_pattern
        seconds: "20"
        id: minute
      - platform: time_pattern
        minutes: "59"
        seconds: "45"
        id: hour_end
    condition:
      - condition: state
        entity_id: input_boolean.sentinel_x1_ph_hold
        state: "on"
      - condition: state
        entity_id: input_boolean.sentinel_x1_ph_fallback
        state: "off"
    variables:
      e: "{{ states('input_text.sentinel_x1_ph_entity') | trim }}"
      v: "{{ states(e) | float(-1) if e else -1 }}"
      rep_min: >-
        {%- set so = states[e] if (e and states[e] is not none) else none -%}
        {%- if so is not none -%}
          {%- set t = so.last_reported if so.last_reported is defined else so.last_updated -%}
          {{ ((as_timestamp(now()) - as_timestamp(t)) / 60) | round(0) }}
        {%- else -%}9999{%- endif -%}
      chg_h: >-
        {%- set so = states[e] if (e and states[e] is not none) else none -%}
        {{ ((as_timestamp(now()) - as_timestamp(so.last_changed)) / 3600) | round(1) if so is not none else 999 }}
      S: "{{ state_attr('sensor.sentinel_x1_kh', 'strength') | float(0) }}"
      vol: "{{ state_attr('sensor.sentinel_x1_kh', 'volume_l') | float(0) }}"
      tgt: "{{ states('input_number.sentinel_x1_ph_target') | float(8.29) }}"
      mlh: "{{ states('input_number.sentinel_x1_ph_max_ml_h') | float(0) }}"
      D: "{{ states('input_number.sentinel_x1_hour_ml') | float(0) }}"
      p0: "{{ states('input_number.sentinel_x1_ph_hr_start') | float(0) }}"
      dph: "{{ (v - p0) if (p0 > 0 and v > 0) else 0 }}"
      # most pH the dosed kalk could add in a closed tank with low buffering (0.3 meq/L per pH unit)
      rmax: "{{ (S * D * 100 / vol / 2.8 / 0.3) if vol > 0 else 0 }}"
      full: "{{ D >= 0.75 * mlh and v > 0 and v < tgt }}"
      sh: "{{ [states('input_number.sentinel_x1_ph_streak_h') | int(0) + (1 if full else 0), 48] | min }}"
      sml: "{{ states('input_number.sentinel_x1_ph_streak_ml') | float(0) + (D if full else 0) }}"
      sp0: "{{ states('input_number.sentinel_x1_ph_streak_start') | float(0) if states('input_number.sentinel_x1_ph_streak_h') | int(0) > 0 else p0 }}"
      # closed-system buffer capacity of seawater (meq/L per pH unit), fitted to carbonate equilibria:
      # about 0.44 at 6 dKH/pH 7.8 up to 1.6 at 12 dKH/pH 8.4
      khv: "{{ states('sensor.sentinel_x1_kh') | float(8) if states('sensor.sentinel_x1_kh') | float(0) > 0 else 8 }}"
      beta: "{{ khv * 0.088 * 10 ** (0.55 * ((v if v > 0 else 8.2) - 8)) }}"
      exp_rise: "{{ (S * sml * 100 / vol / 2.8 / beta) if (vol > 0 and beta > 0) else 0 }}"
      why: >-
        {%- if not is_state('input_select.sentinel_x1_kh_product', 'Saturated kalkwasser') -%}The product is no longer Saturated kalkwasser.
        {%- elif vol <= 0 -%}Tank volume isn't set (Tank & product on the Status tab), so the pH response can't be checked.
        {%- elif not e -%}No pH probe is selected.
        {%- elif v < 0 -%}The pH probe is unavailable.
        {%- elif v < 7 or v > 9 -%}The pH reading ({{ v }}) is outside 7.0–9.0, so the probe is suspect.
        {%- elif chg_h | float > 6 -%}The pH reading hasn't changed in {{ chg_h }} hours, so the probe may be stuck.
        {%- elif trigger.id == 'hour_end' and dph > rmax + 0.25 -%}pH rose {{ dph | round(2) }} in an hour. The {{ D | round(1) }} mL of kalk dosed can explain about {{ rmax | round(3) }} at most.
        {%- elif trigger.id == 'hour_end' and dph < -0.3 -%}pH fell {{ (-dph) | round(2) }} in an hour, which is faster than a reef normally moves.
        {%- elif trigger.id == 'hour_end' and sh >= 4 and exp_rise >= 0.3 and v - sp0 <= 0 -%}{{ sml | round(1) }} mL of kalk over {{ sh }} hours at full rate should have raised pH about {{ exp_rise | round(2) }}, but it didn't rise ({{ sp0 | round(2) }} → {{ v }}). Check the kalk container, dosing line and probe.
        {%- endif -%}
    action:
      - choose:
          - conditions: "{{ why | trim != '' }}"
            sequence:
              - service: input_boolean.turn_on
                target: { entity_id: input_boolean.sentinel_x1_ph_fallback }
              - service: input_text.set_value
                target: { entity_id: input_text.sentinel_x1_ph_fallback_why }
                data: { value: "{{ why | trim | truncate(250) }}" }
              - service: script.sentinel_x1_alert
                data:
                  title: "Sentinel X1 pH hold: back to daily plan"
                  message: >-
                    {{ why | trim }}
                    {%- set d = states('input_number.sentinel_x1_effective_ml') | float(0) -%}
                    {{ ' Now dosing the daily plan (' ~ d ~ ' mL/day).' if d > 0 else ' No daily volume is set, so dosing has stopped.' }}
                    Tap Retry pH hold once it's sorted.
          - conditions: "{{ trigger.id == 'hour_end' }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.sentinel_x1_ph_streak_h }
                data: { value: "{{ sh if full else 0 }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.sentinel_x1_ph_streak_ml }
                data: { value: "{{ (sml if full else 0) | round(2) }}" }
              - if: "{{ full and sh == 1 }}"
                then:
                  - service: input_number.set_value
                    target: { entity_id: input_number.sentinel_x1_ph_streak_start }
                    data: { value: "{{ p0 }}" }
      - if: "{{ trigger.id == 'hour_end' }}"
        then:
          - delay: { seconds: 20 }
          - service: input_number.set_value
            target: { entity_id: input_number.sentinel_x1_ph_hr_start }
            data: { value: "{{ states('sensor.sentinel_x1_ph') | float(0) }}" }

  # ---- alerts ----
  - id: sentinel_x1_alerts
    alias: Sentinel X1 · Alerts
    mode: queued
    trigger:
      - platform: state
        entity_id: sensor.sentinel_x1_engine
        attribute: block
        id: block
      - platform: numeric_state
        entity_id: sensor.sentinel_x1_container_days
        below: input_number.sentinel_x1_container_alert_days
        id: container
      - platform: template
        value_template: >-
          {{ states('input_number.sentinel_x1_tube_hours') | float(0) >=
             0.9 * states('input_number.sentinel_x1_tube_life') | float(2000) }}
        id: tube
      - platform: time
        at: "09:00:00"
        id: daily
    action:
      - choose:
          - conditions: >-
              {{ trigger.id == 'block' and trigger.to_state.attributes.block | default('') | trim in
                 ['Pump offline', 'Pump error', 'Pump unavailable',
                  'Container empty', 'KH above pH-hold limit', 'Return pump off',
                  'Daily ceiling reached', 'Hourly ceiling reached', 'Needs calibration'] }}
            sequence:
              - service: script.sentinel_x1_alert
                data:
                  title: "Sentinel X1 paused"
                  message: "{{ trigger.to_state.attributes.block | trim }}"
          - conditions: "{{ trigger.id == 'container' }}"
            sequence:
              - service: script.sentinel_x1_alert
                data:
                  title: "Sentinel X1 container low"
                  message: "{{ states('sensor.sentinel_x1_container_days') }} days left ({{ states('input_number.sentinel_x1_container_ml') | float(0) | round(0) }} mL)."
          - conditions: "{{ trigger.id == 'tube' }}"
            sequence:
              - service: script.sentinel_x1_alert
                data:
                  title: "Sentinel X1 tubing"
                  message: "Tubing at {{ states('input_number.sentinel_x1_tube_hours') | float(0) | round(0) }} h. Replace and recalibrate."
          - conditions: >-
              {{ trigger.id == 'daily' and states('sensor.sentinel_x1_calibration_age') | int(0) >= 90
                 and is_state('input_boolean.sentinel_x1_cal_reminded', 'off') }}
            sequence:
              - service: input_boolean.turn_on
                target: { entity_id: input_boolean.sentinel_x1_cal_reminded }
              - service: persistent_notification.create
                data:
                  notification_id: sentinel_x1_cal_reminder
                  title: "Sentinel X1: recalibration recommended"
                  message: "Last calibration was {{ states('sensor.sentinel_x1_calibration_age') }} days ago. Tubing wears and flow drifts, so a fresh three-speed calibration is recommended (Settings tab). Optional: dismiss this if the pump is dosing as expected."
              - variables:
                  svc: "{{ states('input_text.sentinel_x1_notify') | trim }}"
              - if: "{{ svc.startswith('notify.') }}"
                then:
                  - service: "{{ svc }}"
                    continue_on_error: true
                    data:
                      title: "Sentinel X1: recalibration recommended"
                      message: "Last calibration {{ states('sensor.sentinel_x1_calibration_age') }} days ago. Recommended, not required."

  # ---- pH probe / KH source dropdowns: list matching sensors ----
  - id: sentinel_x1_source_options
    alias: Sentinel X1 · Sensor lists
    mode: queued
    trigger:
      - platform: homeassistant
        event: start
      - platform: event
        event_type: automation_reloaded
      - platform: time
        at: "03:12:00"
    variables:
      ph_opts: >-
        {%- set ns = namespace(o=['Not used']) -%}
        {%- for s in states.sensor -%}
          {%- set u = (s.attributes.get('unit_of_measurement') or '') | lower -%}
          {%- if (u == 'ph' or s.attributes.device_class == 'ph' or s.entity_id is search('(\\.|_)ph(_|$)')) and not s.entity_id.startswith('sensor.sentinel_x1') -%}
            {%- set ns.o = ns.o + [s.name ~ ' (' ~ s.entity_id ~ ')'] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.o }}
      kh_opts: >-
        {%- set ns = namespace(o=['Manual entry']) -%}
        {%- for s in states.sensor -%}
          {%- set u = (s.attributes.get('unit_of_measurement') or '') | lower -%}
          {%- if (u in ['dkh', 'meq/l'] or s.entity_id is search('(alk|dkh|(\\.|_)kh(_|$))')) and not s.entity_id.startswith('sensor.sentinel_x1') -%}
            {%- set ns.o = ns.o + [s.name ~ ' (' ~ s.entity_id ~ ')'] -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.o }}
      ret_opts: >-
        {%- set ns = namespace(o=['Not used']) -%}
        {%- for s in states.switch | sort(attribute='name') -%}
          {%- set ns.o = ns.o + [s.name ~ ' (' ~ s.entity_id ~ ')'] -%}
        {%- endfor -%}
        {{ ns.o }}
      ret_now: "{{ states('input_text.sentinel_x1_return_entity') | trim }}"
      ret_pick: "{{ (ret_opts | select('search', '\\(' ~ ret_now ~ '\\)$') | list + ['Not used'])[0] if ret_now else 'Not used' }}"
      ph_now: "{{ states('input_text.sentinel_x1_ph_entity') | trim }}"
      kh_now: "{{ states('input_text.sentinel_x1_kh_entity') | trim }}"
      ph_pick: "{{ (ph_opts | select('search', '\\(' ~ ph_now ~ '\\)$') | list + ['Not used'])[0] if ph_now else 'Not used' }}"
      kh_pick: "{{ (kh_opts | select('search', '\\(' ~ kh_now ~ '\\)$') | list + ['Manual entry'])[0] if kh_now not in ['', 'manual'] else 'Manual entry' }}"
    action:
      - service: input_select.set_options
        target: { entity_id: input_select.sentinel_x1_ph_source }
        data: { options: "{{ ph_opts }}" }
      - service: input_select.select_option
        target: { entity_id: input_select.sentinel_x1_ph_source }
        data: { option: "{{ ph_pick }}" }
      - service: input_select.set_options
        target: { entity_id: input_select.sentinel_x1_kh_source }
        data: { options: "{{ kh_opts }}" }
      - service: input_select.select_option
        target: { entity_id: input_select.sentinel_x1_kh_source }
        data: { option: "{{ kh_pick }}" }
      - service: input_select.set_options
        target: { entity_id: input_select.sentinel_x1_return_source }
        data: { options: "{{ ret_opts }}" }
      - service: input_select.select_option
        target: { entity_id: input_select.sentinel_x1_return_source }
        data: { option: "{{ ret_pick }}" }

  - id: sentinel_x1_source_chosen
    alias: Sentinel X1 · Sensor chosen
    mode: queued
    trigger:
      - platform: state
        entity_id: input_select.sentinel_x1_ph_source
        id: ph
      - platform: state
        entity_id: input_select.sentinel_x1_kh_source
        id: kh
      - platform: state
        entity_id: input_select.sentinel_x1_return_source
        id: ret
    condition: "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"
    action:
      - variables:
          o: "{{ trigger.to_state.state }}"
          eid: "{{ o.split('(')[-1].rstrip(')') if o.endswith(')') else '' }}"
      - choose:
          - conditions: "{{ trigger.id == 'ph' }}"
            sequence:
              - service: input_text.set_value
                target: { entity_id: input_text.sentinel_x1_ph_entity }
                data: { value: "{{ eid if eid else ' ' }}" }
          - conditions: "{{ trigger.id == 'kh' }}"
            sequence:
              - service: input_text.set_value
                target: { entity_id: input_text.sentinel_x1_kh_entity }
                data: { value: "{{ eid if eid else 'manual' }}" }
          - conditions: "{{ trigger.id == 'ret' }}"
            sequence:
              - service: input_text.set_value
                target: { entity_id: input_text.sentinel_x1_return_entity }
                data: { value: "{{ eid if eid else ' ' }}" }

  # ---- KH auto-tune switched on/off ----
  - id: sentinel_x1_kh_enable
    alias: Sentinel X1 · KH auto-tune switched
    trigger:
      - platform: state
        entity_id: input_boolean.sentinel_x1_kh_enabled
        to: ["on", "off"]
    action:
      - if: "{{ trigger.to_state.state == 'on' }}"
        then:
          - if: "{{ is_state('input_boolean.sentinel_x1_ph_hold', 'on') }}"
            then:
              - service: input_boolean.turn_off
                target: { entity_id: input_boolean.sentinel_x1_ph_hold }
          - service: input_number.set_value
            target: { entity_id: input_number.sentinel_x1_kh_base_ml }
            data: { value: "{{ states('input_number.sentinel_x1_effective_ml') | float(0) }}" }
          - service: input_number.set_value
            target: { entity_id: input_number.sentinel_x1_kh_corr_ml_day }
            data: { value: 0 }
          - service: input_select.select_option
            target: { entity_id: input_select.sentinel_x1_kh_phase }
            data: { option: Ready }
          - delay: { seconds: 2 }
          - service: automation.trigger
            target: { entity_id: automation.sentinel_x1_kh_auto_tune }
        else:
          - service: input_select.select_option
            target: { entity_id: input_select.sentinel_x1_kh_phase }
            data: { option: "Off" }
          - variables:
              b: "{{ states('input_number.sentinel_x1_kh_base_ml') | float(0) }}"
          - service: input_number.set_value
            target: { entity_id: [input_number.sentinel_x1_target_ml, input_number.sentinel_x1_effective_ml] }
            data: { value: "{{ b }}" }
          - service: input_number.set_value
            target: { entity_id: input_number.sentinel_x1_kh_corr_ml_day }
            data: { value: 0 }

  # ---- KH auto-tune: 2/3 correction, wait, verify; any surprise -> stop and ask for a manual test ----
  - id: sentinel_x1_kh_auto_tune
    alias: Sentinel X1 · KH auto-tune
    mode: single
    trigger:
      - platform: time
        at: "06:05:00"
    condition:
      - condition: state
        entity_id: input_boolean.sentinel_x1_kh_enabled
        state: "on"
    variables:
      kh: "{{ states('sensor.sentinel_x1_kh') | float(0) }}"
      valid: "{{ state_attr('sensor.sentinel_x1_kh', 'valid') | bool(false) }}"
      k: "{{ state_attr('sensor.sentinel_x1_kh', 'k') | float(0) }}"
      maxml: "{{ state_attr('sensor.sentinel_x1_kh', 'max_ml_day') | float(0) }}"
      phase: "{{ states('input_select.sentinel_x1_kh_phase') }}"
      target: "{{ states('input_number.sentinel_x1_kh_target') | float(8.3) }}"
      w: "{{ states('input_number.sentinel_x1_kh_wait_days') | int(3) }}"
      tol: "{{ (states('input_number.sentinel_x1_kh_tolerance') | float(30)) / 100 }}"
      maxrise: "{{ states('input_number.sentinel_x1_kh_max_rise') | float(0.5) }}"
      base: "{{ states('input_number.sentinel_x1_kh_base_ml') | float(0) }}"
      start: "{{ states('input_number.sentinel_x1_kh_start') | float(0) }}"
      expc: "{{ states('input_number.sentinel_x1_kh_expected') | float(0) }}"
      day: "{{ states('input_number.sentinel_x1_kh_cycle_day') | int(0) + 1 }}"
      expected_now: "{{ expc * ([day / w, 1] | min) }}"
      actual: "{{ kh - start }}"
      dev: "{{ actual - expected_now }}"
      allowed: "{{ [0.3, tol * (expc | abs)] | max }}"
      new_base: "{{ ([base - ((actual - expc) / w) / k, 0] | max) if k > 0 else base }}"
      base_jump: "{{ base > 2 and ((new_base - base) | abs) > 0.5 * base }}"
    action:
      - choose:
          - conditions: "{{ k <= 0 }}"
            sequence:
              - service: script.sentinel_x1_alert
                data:
                  title: "Sentinel X1 KH auto-tune waiting"
                  message: "Set the tank water volume and the alkalinity product (Tank & product on the Status tab)."
              - stop: no setup
          - conditions: "{{ not valid }}"
            sequence:
              - service: script.sentinel_x1_alert
                data:
                  title: "Sentinel X1 KH auto-tune: no usable KH reading"
                  message: "No fresh, plausible KH reading today ({{ kh }} dKH, {{ state_attr('sensor.sentinel_x1_kh', 'age_h') }} h old). Dose left unchanged. Enter a KH test to continue."
              - stop: no reading
          - conditions: "{{ phase == 'Needs manual test' }}"
            sequence:
              - service: script.sentinel_x1_alert
                data:
                  title: "Sentinel X1 KH auto-tune paused"
                  message: "Still waiting for a manual KH test. Dosing at the safe base dose of {{ base | round(1) }} mL/day."
              - stop: waiting for test
          - conditions: "{{ phase == 'Correcting' and ((dev | abs) > allowed or base_jump) }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: [input_number.sentinel_x1_target_ml, input_number.sentinel_x1_effective_ml] }
                data: { value: "{{ base | round(2) }}" }
              - service: input_number.set_value
                target: { entity_id: input_number.sentinel_x1_kh_corr_ml_day }
                data: { value: 0 }
              - service: input_select.select_option
                target: { entity_id: input_select.sentinel_x1_kh_phase }
                data: { option: Needs manual test }
              - service: script.sentinel_x1_alert
                data:
                  title: "Sentinel X1 KH: manual test needed"
                  message: >-
                    Day {{ day }} of {{ w }}: KH moved {{ actual | round(2) }} dKH, expected {{ expected_now | round(2) }} (allowed ±{{ allowed | round(2) }}).
                    {%- if base_jump %} The dose needed to hold KH would change by more than half.{% endif %}
                    Correction stopped; dosing the base {{ base | round(1) }} mL/day. Test KH by hand and enter it with "Enter KH test".
              - stop: anomaly
          - conditions: "{{ phase == 'Correcting' and day < w }}"
            sequence:
              - service: input_number.set_value
                target: { entity_id: input_number.sentinel_x1_kh_cycle_day }
                data: { value: "{{ day }}" }
              - stop: waiting
      # ---- start a new cycle (first run, after a manual test, or when the waiting period ends) ----
      - variables:
          b: "{{ new_base if phase == 'Correcting' else base }}"
          err: "{{ target - kh }}"
          per_day: "{{ (2 / 3) * err / k / w }}"
          per_day_c: "{{ [[per_day, maxrise / k] | min, -b] | max }}"
          d_raw: "{{ [b + per_day_c, 0] | max }}"
          d: "{{ ([d_raw, maxml] | min) if maxml > 0 else d_raw }}"
          exp_new: "{{ (d - b) * k * w }}"
      - service: input_number.set_value
        target: { entity_id: [input_number.sentinel_x1_target_ml, input_number.sentinel_x1_effective_ml] }
        data: { value: "{{ d | round(2) }}" }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_kh_base_ml }
        data: { value: "{{ b | round(2) }}" }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_kh_corr_ml_day }
        data: { value: "{{ (d - b) | round(2) }}" }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_kh_start }
        data: { value: "{{ kh }}" }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_kh_expected }
        data: { value: "{{ exp_new | round(3) }}" }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_kh_cycle_day }
        data: { value: 0 }
      - service: input_select.select_option
        target: { entity_id: input_select.sentinel_x1_kh_phase }
        data: { option: Correcting }
      - if: "{{ maxml > 0 and d_raw > maxml }}"
        then:
          - service: script.sentinel_x1_alert
            data:
              title: "Sentinel X1 KH: product limit reached"
              message: "Wanted {{ d_raw | round(1) }} mL/day; the product's label limit for this tank is {{ maxml | round(1) }} mL/day."

# =====================================================================
#  SCRIPTS
# =====================================================================
script:
  sentinel_x1_alert:
    alias: Sentinel X1 · Alert
    mode: queued
    fields:
      title: { description: Title }
      message: { description: Message }
    sequence:
      - service: persistent_notification.create
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          notification_id: "sentinel_x1_{{ title | slugify }}"
      - variables:
          svc: "{{ states('input_text.sentinel_x1_notify') | trim }}"
      - if: "{{ svc.startswith('notify.') }}"
        then:
          - service: "{{ svc }}"
            continue_on_error: true
            data:
              title: "{{ title }}"
              message: "{{ message }}"

  sentinel_x1_count:
    alias: Sentinel X1 · Count delivered volume (internal)
    mode: queued
    fields:
      ml: { description: "mL delivered into the tank" }
      hours: { description: "pump run time in hours" }
      tank: { description: "false when the liquid went into a measuring cylinder, not the tank" }
    sequence:
      - variables:
          v: "{{ ml | float(0) }}"
          into_tank: "{{ tank | default(true) | bool(true) }}"
      - if: "{{ v > 0 and into_tank }}"
        then:
          - service: input_number.set_value
            target: { entity_id: input_number.sentinel_x1_today_ml }
            data: { value: "{{ (states('input_number.sentinel_x1_today_ml') | float(0) + v) | round(3) }}" }
          - service: input_number.set_value
            target: { entity_id: input_number.sentinel_x1_hour_ml }
            data: { value: "{{ (states('input_number.sentinel_x1_hour_ml') | float(0) + v) | round(3) }}" }
      - if: "{{ v > 0 }}"
        then:
          - service: input_number.set_value
            target: { entity_id: input_number.sentinel_x1_container_ml }
            data: { value: "{{ ([states('input_number.sentinel_x1_container_ml') | float(0) - v, 0] | max) | round(1) }}" }
      - if: "{{ hours | float(0) > 0 }}"
        then:
          - service: input_number.set_value
            target: { entity_id: input_number.sentinel_x1_tube_hours }
            data: { value: "{{ (states('input_number.sentinel_x1_tube_hours') | float(0) + hours | float(0)) | round(4) }}" }

  sentinel_x1_ph_retry:
    alias: Sentinel X1 · Retry pH hold
    icon: mdi:refresh
    sequence:
      - service: input_number.set_value
        target: { entity_id: [input_number.sentinel_x1_ph_streak_h, input_number.sentinel_x1_ph_streak_ml] }
        data: { value: 0 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_ph_hr_start }
        data: { value: "{{ states('sensor.sentinel_x1_ph') | float(0) }}" }
      - service: input_text.set_value
        target: { entity_id: input_text.sentinel_x1_ph_fallback_why }
        data: { value: " " }
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_ph_fallback }

  sentinel_x1_start_pause:
    alias: Sentinel X1 · Start pause (internal)
    mode: queued
    fields:
      kind: { description: "Feed or Maintenance" }
    sequence:
      - if: "{{ states('input_select.sentinel_x1_pause_kind') not in ['Off', 'None', kind] }}"
        then:
          - service: script.sentinel_x1_resume
      - variables:
          mins: "{{ states('input_number.sentinel_x1_feed_minutes' if kind == 'Feed' else 'input_number.sentinel_x1_maint_minutes') | int(10) }}"
          n: "{{ states('input_number.sentinel_x1_feed_n' if kind == 'Feed' else 'input_number.sentinel_x1_maint_n') | int(1) }}"
      - service: input_select.select_option
        target: { entity_id: input_select.sentinel_x1_pause_kind }
        data: { option: "{{ kind }}" }
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.sentinel_x1_pause_until }
        data: { timestamp: "{{ as_timestamp(now()) + mins * 60 }}" }
      - service: switch.turn_off
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: "sentinel_controller.{{ 'start_feed_pause' if kind == 'Feed' else 'start_maintenance' }}"
        continue_on_error: true
        data: { n: "{{ n }}" }

  sentinel_x1_pause_feed:
    alias: Sentinel X1 · Feed
    icon: mdi:fish
    sequence:
      - service: script.sentinel_x1_start_pause
        data: { kind: Feed }

  sentinel_x1_pause_maint:
    alias: Sentinel X1 · Maintenance
    icon: mdi:wrench
    sequence:
      - service: script.sentinel_x1_start_pause
        data: { kind: Maintenance }

  sentinel_x1_pause_add30:
    alias: Sentinel X1 · +30 min
    icon: mdi:timer-plus-outline
    sequence:
      - condition: template
        value_template: >-
          {{ states('input_select.sentinel_x1_pause_kind') in ['Feed', 'Maintenance']
             and as_timestamp(states('input_datetime.sentinel_x1_pause_until'), 0) > as_timestamp(now()) }}
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.sentinel_x1_pause_until }
        data: { timestamp: "{{ as_timestamp(states('input_datetime.sentinel_x1_pause_until')) + 1800 }}" }

  sentinel_x1_resume:
    alias: Sentinel X1 · End pause
    icon: mdi:play
    mode: queued
    variables:
      kind: "{{ states('input_select.sentinel_x1_pause_kind') }}"
      n: "{{ states('input_number.sentinel_x1_feed_n' if kind == 'Feed' else 'input_number.sentinel_x1_maint_n') | int(1) }}"
    sequence:
      - service: input_select.select_option
        target: { entity_id: input_select.sentinel_x1_pause_kind }
        data: { option: "Off" }
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.sentinel_x1_pause_until }
        data: { timestamp: "{{ as_timestamp(now()) - 60 }}" }
      - if: "{{ kind in ['Feed', 'Maintenance'] }}"
        then:
          - service: "sentinel_controller.{{ 'stop_feed_pause' if kind == 'Feed' else 'stop_maintenance' }}"
            continue_on_error: true
            data: { n: "{{ n }}" }

  sentinel_x1_stop_all:
    alias: Sentinel X1 · STOP
    icon: mdi:stop-circle
    sequence:
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_enabled }
      - service: switch.turn_off
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: button.press
        target: { entity_id: button.kamoer_x1_pro_t_kamoer_stop }

  sentinel_x1_manual_dose:
    alias: Sentinel X1 · Manual dose
    icon: mdi:hand-water
    fields:
      amount:
        name: How much to dose
        description: Millilitres to dose now
        required: true
        default: 1
        selector:
          number: { min: 0.1, max: 50, step: 0.1, unit_of_measurement: mL, mode: box }
    variables:
      ml: "{{ (amount if amount is defined else states('input_number.sentinel_x1_manual_ml')) | float(0) }}"
      limit: "{{ states('input_number.sentinel_x1_manual_max') | float(10) }}"
      today: "{{ states('input_number.sentinel_x1_today_ml') | float(0) }}"
      cap: "{{ state_attr('sensor.sentinel_x1_engine', 'daily_cap') | float(0) }}"
      cal_ok: "{{ state_attr('sensor.sentinel_x1_engine', 'cal_ok') | bool(false) }}"
      rpm: "{{ states('input_number.sentinel_x1_pulse_rpm') | float(200) }}"
      pf: "{{ state_attr('sensor.sentinel_x1_engine', 'pulse_flow') | float(0) }}"
      floor: "{{ state_attr('sensor.sentinel_x1_engine', 'min_pulse_eff') | float(0.5) }}"
      guard: >-
        {%- if is_state('binary_sensor.kamoer_x1_pro_t_kamoer_pulse_fault', 'on') -%}Pump fault is latched
        {%- elif is_state('input_boolean.sentinel_x1_ph_trip', 'on') -%}Paused: pH above alarm limit
        {%- elif is_state('input_boolean.sentinel_x1_kh_trip', 'on') -%}Paused: KH above ceiling{%- endif -%}
    sequence:
      - if: "{{ ml > limit or today + ml > cap or not cal_ok or ml < floor or guard != '' }}"
        then:
          - service: script.sentinel_x1_alert
            data:
              title: "Sentinel X1 manual dose refused"
              message: >-
                {%- if not cal_ok -%}Not calibrated.
                {%- elif guard != '' -%}{{ guard }}.
                {%- elif ml < floor -%}{{ ml }} mL is under the {{ floor }} mL smallest accurate dose.
                {%- elif ml > limit -%}{{ ml }} mL is above the {{ limit }} mL manual limit.
                {%- else -%}Would exceed today's ceiling ({{ today | round(1) }} + {{ ml }} > {{ cap | round(1) }} mL).{%- endif -%}
          - stop: refused
      - service: switch.turn_off
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: number.set_value
        target: { entity_id: number.kamoer_x1_pro_t_kamoer_speed }
        data: { value: "{{ rpm }}" }
      - service: number.set_value
        target: { entity_id: number.kamoer_x1_pro_t_kamoer_dose_volume }
        data: { value: "{{ ml }}" }
      - delay: { milliseconds: 500 }
      - service: button.press
        target: { entity_id: button.kamoer_x1_pro_t_kamoer_dose_now }
      - service: script.sentinel_x1_count
        data:
          ml: "{{ ml }}"
          hours: "{{ (ml / pf / 60) if pf > 0 else 0 }}"

  sentinel_x1_prime:
    alias: Sentinel X1 · Prime
    icon: mdi:pipe-valve
    sequence:
      - service: input_boolean.turn_on
        target: { entity_id: input_boolean.sentinel_x1_calibrating }
      - service: number.set_value
        target: { entity_id: number.kamoer_x1_pro_t_kamoer_speed }
        data: { value: 350 }
      - service: switch.turn_on
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - delay: { seconds: "{{ states('input_number.sentinel_x1_prime_seconds') | int(10) }}" }
      - service: switch.turn_off
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_calibrating }
      - variables:
          secs: "{{ states('input_number.sentinel_x1_prime_seconds') | int(10) }}"
      - service: script.sentinel_x1_count
        data:
          ml: "{{ states('number.kamoer_x1_pro_t_kamoer_cal_350_rpm') | float(0) * secs / 60 }}"
          hours: "{{ secs / 3600 }}"
          tank: false

  sentinel_x1_cal_run_low:
    alias: Sentinel X1 · Calibrate low speed (5 min)
    icon: mdi:speedometer-slow
    mode: single
    sequence:
      - if: "{{ is_state('input_boolean.sentinel_x1_enabled', 'on') }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: sentinel_x1_cal_blocked
              title: Sentinel X1 calibration not started
              message: The dosing schedule is on. Start calibration from the Sentinel X1 page, which offers to turn the schedule off first.
          - stop: schedule is on
      - service: timer.cancel
        target: { entity_id: timer.sentinel_x1_sched_alert }
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_cal_ask_restart }
      - service: input_boolean.turn_on
        target: { entity_id: input_boolean.sentinel_x1_calibrating }
      - service: switch.turn_off
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - delay: { seconds: 2 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_cal_expect_low }
        data: { value: "{{ (states('number.kamoer_x1_pro_t_kamoer_cal_low') | float(0) * 5) | round(2) }}" }
      - service: number.set_value
        target: { entity_id: number.kamoer_x1_pro_t_kamoer_speed }
        data: { value: "{{ states('number.kamoer_x1_pro_t_kamoer_cal_low_speed') | float(30) }}" }
      - service: switch.turn_on
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: timer.start
        target: { entity_id: timer.sentinel_x1_cal }
        data: { duration: 300 }
      - delay: { seconds: 300 }
      - service: switch.turn_off
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: timer.cancel
        target: { entity_id: timer.sentinel_x1_cal }
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_calibrating }
      - service: script.sentinel_x1_count
        data: { ml: "{{ states('number.kamoer_x1_pro_t_kamoer_cal_low') | float(0) * 5 }}", hours: "{{ 300 / 3600 }}", tank: false }

  sentinel_x1_cal_run_mid:
    alias: Sentinel X1 · Calibrate 200 RPM (60 s)
    icon: mdi:speedometer-medium
    mode: single
    sequence:
      - if: "{{ is_state('input_boolean.sentinel_x1_enabled', 'on') }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: sentinel_x1_cal_blocked
              title: Sentinel X1 calibration not started
              message: The dosing schedule is on. Start calibration from the Sentinel X1 page, which offers to turn the schedule off first.
          - stop: schedule is on
      - service: timer.cancel
        target: { entity_id: timer.sentinel_x1_sched_alert }
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_cal_ask_restart }
      - service: input_boolean.turn_on
        target: { entity_id: input_boolean.sentinel_x1_calibrating }
      - service: switch.turn_off
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - delay: { seconds: 2 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_cal_expect_mid }
        data: { value: "{{ states('number.kamoer_x1_pro_t_kamoer_cal_200_rpm') | float(0) | round(2) }}" }
      - service: number.set_value
        target: { entity_id: number.kamoer_x1_pro_t_kamoer_speed }
        data: { value: "200" }
      - service: switch.turn_on
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: timer.start
        target: { entity_id: timer.sentinel_x1_cal }
        data: { duration: 60 }
      - delay: { seconds: 60 }
      - service: switch.turn_off
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: timer.cancel
        target: { entity_id: timer.sentinel_x1_cal }
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_calibrating }
      - service: script.sentinel_x1_count
        data: { ml: "{{ states('number.kamoer_x1_pro_t_kamoer_cal_200_rpm') | float(0) }}", hours: "{{ 60 / 3600 }}", tank: false }

  sentinel_x1_cal_run_high:
    alias: Sentinel X1 · Calibrate 350 RPM (60 s)
    icon: mdi:speedometer
    mode: single
    sequence:
      - if: "{{ is_state('input_boolean.sentinel_x1_enabled', 'on') }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: sentinel_x1_cal_blocked
              title: Sentinel X1 calibration not started
              message: The dosing schedule is on. Start calibration from the Sentinel X1 page, which offers to turn the schedule off first.
          - stop: schedule is on
      - service: timer.cancel
        target: { entity_id: timer.sentinel_x1_sched_alert }
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_cal_ask_restart }
      - service: input_boolean.turn_on
        target: { entity_id: input_boolean.sentinel_x1_calibrating }
      - service: switch.turn_off
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - delay: { seconds: 2 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_cal_expect_high }
        data: { value: "{{ states('number.kamoer_x1_pro_t_kamoer_cal_350_rpm') | float(0) | round(2) }}" }
      - service: number.set_value
        target: { entity_id: number.kamoer_x1_pro_t_kamoer_speed }
        data: { value: "350" }
      - service: switch.turn_on
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: timer.start
        target: { entity_id: timer.sentinel_x1_cal }
        data: { duration: 60 }
      - delay: { seconds: 60 }
      - service: switch.turn_off
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: timer.cancel
        target: { entity_id: timer.sentinel_x1_cal }
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_calibrating }
      - service: script.sentinel_x1_count
        data: { ml: "{{ states('number.kamoer_x1_pro_t_kamoer_cal_350_rpm') | float(0) }}", hours: "{{ 60 / 3600 }}", tank: false }

  sentinel_x1_cal_run_pulses:
    alias: Sentinel X1 · Pulse check (50 pulses)
    icon: mdi:water-check
    mode: single
    variables:
      size: "{{ state_attr('sensor.sentinel_x1_engine', 'min_pulse_eff') | float(0.5) }}"
      pf: "{{ state_attr('sensor.sentinel_x1_engine', 'pulse_flow') | float(0) }}"
      gap: "{{ ([(size / pf * 60 + 2) if pf > 0 else 3, 3] | max) | round(1) }}"
    sequence:
      - if: "{{ is_state('input_boolean.sentinel_x1_enabled', 'on') }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: sentinel_x1_cal_blocked
              title: Sentinel X1 calibration not started
              message: The dosing schedule is on. Start calibration from the Sentinel X1 page, which offers to turn the schedule off first.
          - stop: schedule is on
      - service: timer.cancel
        target: { entity_id: timer.sentinel_x1_sched_alert }
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_cal_ask_restart }
      - service: input_boolean.turn_on
        target: { entity_id: input_boolean.sentinel_x1_calibrating }
      - service: switch.turn_off
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: number.set_value
        target: { entity_id: number.kamoer_x1_pro_t_kamoer_speed }
        data: { value: "{{ states('input_number.sentinel_x1_pulse_rpm') | float(200) }}" }
      - service: number.set_value
        target: { entity_id: number.kamoer_x1_pro_t_kamoer_dose_volume }
        data: { value: "{{ size }}" }
      - delay: { seconds: 1 }
      - service: timer.start
        target: { entity_id: timer.sentinel_x1_cal }
        data: { duration: "{{ (50 * gap) | round(0, 'ceil') | int }}" }
      - repeat:
          count: 50
          sequence:
            - service: button.press
              target: { entity_id: button.kamoer_x1_pro_t_kamoer_dose_now }
            - delay: { seconds: "{{ gap }}" }
      - service: timer.cancel
        target: { entity_id: timer.sentinel_x1_cal }
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_calibrating }
      - service: script.sentinel_x1_count
        data: { ml: "{{ 50 * size }}", hours: "{{ (50 * size / pf / 60) if pf > 0 else 0 }}", tank: false }

  # ---- pulse check: apply the entered result (dashboard Save button) ----
  # new factor = old × delivered ÷ target. A run's pulses were shortened by the old
  # factor, so this converges. Refused if outside 0.5–1.5: then start/stop overrun is
  # too big a share of the pulse, and the fix is a bigger smallest pulse, not a factor.
  sentinel_x1_pulse_save:
    alias: Sentinel X1 · Save pulse check result
    icon: mdi:content-save-check
    mode: single
    variables:
      size: "{{ state_attr('sensor.sentinel_x1_engine', 'min_pulse_eff') | float(0.5) }}"
      measured: "{{ states('input_number.sentinel_x1_pulse_check_ml') | float(0) }}"
      expected: "{{ 50 * size }}"
      old: "{{ states('number.kamoer_x1_pro_t_kamoer_pulse_factor') | float(1) }}"
      raw: "{{ (old * measured / expected) if expected > 0 else 0 }}"
      overrun: "{{ measured / 50 - size / old }}"
      suggest: "{{ ([((overrun * 10 * 10) | round(0, 'ceil')) / 10, size + 0.1] | max) | round(1) }}"
    sequence:
      - condition: "{{ is_state('input_boolean.sentinel_x1_calibrating', 'off') }}"
      - condition: "{{ measured > 0 }}"
      - if: "{{ size > 1 }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: sentinel_x1_pulse_check
              title: Sentinel X1 pulse check
              message: "The pulse factor only applies to doses of 1 mL or less, and your smallest pulse is {{ size }} mL. Nothing changed."
          - stop: pulse too large
      - if: "{{ raw < 0.5 or raw > 1.5 }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: sentinel_x1_pulse_check
              title: Sentinel X1 pulse check — not saved
              message: >-
                Collected {{ measured }} mL of {{ expected | round(2) }} mL. That needs a factor of
                {{ raw | round(2) }}, outside the 0.5–1.5 the factor can correct.
                {% if overrun > 0 %}Each pulse overran by about {{ (overrun * 1000) | round(0) | int }} µL.
                Raise Smallest accurate pulse to {{ suggest }} mL, then run the check again.{% else %}Check the line for air or a leak, then run the check again.{% endif %}
          - stop: out of range
      - service: number.set_value
        target: { entity_id: number.kamoer_x1_pro_t_kamoer_pulse_factor }
        data: { value: "{{ raw | round(3) }}" }
      - service: persistent_notification.create
        data:
          notification_id: sentinel_x1_pulse_check
          title: Sentinel X1 pulse check — saved
          message: >-
            Collected {{ measured }} mL of {{ expected | round(2) }} mL
            (±10 % = {{ (expected * 0.9) | round(2) }}–{{ (expected * 1.1) | round(2) }} mL).
            Pulse factor {{ old }} → {{ raw | round(3) }}.
            {%- if measured < expected * 0.9 or measured > expected * 1.1 %} Outside ±10 %: run the check again to confirm.{% endif %}
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_pulse_check_ml }
        data: { value: 0 }

  sentinel_x1_pulse_factor_reset:
    alias: Sentinel X1 · Reset pulse factor to 1.000
    icon: mdi:restore
    mode: single
    sequence:
      - service: number.set_value
        target: { entity_id: number.kamoer_x1_pro_t_kamoer_pulse_factor }
        data: { value: 1 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_pulse_check_ml }
        data: { value: 0 }

  # ---- calibration vs the dosing schedule ----
  sentinel_x1_cal_begin:
    alias: Sentinel X1 · Turn schedule off and start calibration run
    icon: mdi:calendar-remove
    mode: single
    fields:
      run: { description: "Calibration script to start, e.g. script.sentinel_x1_cal_run_mid" }
    sequence:
      - condition: "{{ run in ['script.sentinel_x1_cal_run_low', 'script.sentinel_x1_cal_run_mid', 'script.sentinel_x1_cal_run_high', 'script.sentinel_x1_cal_run_pulses', 'script.sentinel_x1_test_run'] }}"
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_enabled }
      - service: input_boolean.turn_on
        target: { entity_id: input_boolean.sentinel_x1_cal_paused }
      - delay: { seconds: 1 }
      - service: script.turn_on
        target: { entity_id: "{{ run }}" }

  sentinel_x1_cal_restart_yes:
    alias: Sentinel X1 · Restart schedule after calibration
    icon: mdi:calendar-check
    sequence:
      - service: input_boolean.turn_on
        target: { entity_id: input_boolean.sentinel_x1_enabled }

  sentinel_x1_cal_restart_no:
    alias: Sentinel X1 · Leave schedule off after calibration
    icon: mdi:calendar-remove
    sequence:
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_cal_ask_restart }
      - service: timer.start
        target: { entity_id: timer.sentinel_x1_sched_alert }
        data: { duration: "00:15:00" }

  sentinel_x1_sched_ack:
    alias: Sentinel X1 · Acknowledge schedule is off
    icon: mdi:bell-check
    sequence:
      - service: timer.cancel
        target: { entity_id: timer.sentinel_x1_sched_alert }
      - service: input_boolean.turn_off
        target: { entity_id: [input_boolean.sentinel_x1_cal_paused, input_boolean.sentinel_x1_cal_ask_restart] }
      - service: persistent_notification.dismiss
        data: { notification_id: sentinel_x1_dosing_schedule_is_off }

  # ---- speed test: timed continuous run at a chosen speed, into a cylinder ----
  # (under 30 min: the bridge's dead-man stops any continuous run at 30 min)
  sentinel_x1_test_run:
    alias: Sentinel X1 · Speed test run
    icon: mdi:speedometer
    mode: single
    variables:
      rpm: "{{ states('input_number.sentinel_x1_test_rpm') | float(30) }}"
      mins: "{{ states('input_number.sentinel_x1_test_minutes') | float(10) }}"
    sequence:
      - if: "{{ is_state('input_boolean.sentinel_x1_enabled', 'on') }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: sentinel_x1_cal_blocked
              title: Sentinel X1 speed test not started
              message: The dosing schedule is on. Start the test from the Sentinel X1 page, which offers to turn the schedule off first.
          - stop: schedule is on
      - service: timer.cancel
        target: { entity_id: timer.sentinel_x1_sched_alert }
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_cal_ask_restart }
      - service: input_boolean.turn_on
        target: { entity_id: input_boolean.sentinel_x1_calibrating }
      - service: switch.turn_off
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_test_collected }
        data: { value: 0 }
      - delay: { seconds: 2 }
      - service: number.set_value
        target: { entity_id: number.kamoer_x1_pro_t_kamoer_speed }
        data: { value: "{{ rpm }}" }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_test_last_rpm }
        data: { value: "{{ rpm }}" }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_test_last_minutes }
        data: { value: "{{ mins }}" }
      - service: switch.turn_on
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: timer.start
        target: { entity_id: timer.sentinel_x1_cal }
        data: { duration: "{{ (mins * 60) | int }}" }
      - delay: { seconds: "{{ (mins * 60) | int }}" }
      - service: switch.turn_off
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: timer.cancel
        target: { entity_id: timer.sentinel_x1_cal }
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_calibrating }
      - variables:
          est: >-
            {%- set p = state_attr('sensor.sentinel_x1_engine', 'flow_curve') or [[0, 0]] -%}
            {%- set ns = namespace(v=0, done=false) -%}{%- for i in range(1, p | count) -%}{%- if not ns.done and (rpm <= p[i][0] or loop.last) -%}{%- set ns.v = p[i-1][1] + (rpm - p[i-1][0]) * (p[i][1] - p[i-1][1]) / (p[i][0] - p[i-1][0]) -%}{%- set ns.done = true -%}{%- endif -%}{%- endfor -%}{{ ns.v }}
      - service: script.sentinel_x1_count
        data: { ml: "{{ est * mins }}", hours: "{{ mins / 60 }}", tank: false }

  # ---- speed test result becomes the low calibration point ----
  sentinel_x1_test_use_low:
    alias: Sentinel X1 · Use speed test as low calibration point
    icon: mdi:beaker-check
    sequence:
      - variables:
          rpm: "{{ states('input_number.sentinel_x1_test_last_rpm') | float(0) }}"
          mins: "{{ states('input_number.sentinel_x1_test_last_minutes') | float(0) }}"
          ml: "{{ states('input_number.sentinel_x1_test_collected') | float(0) }}"
      - condition: "{{ rpm >= 1 and rpm < 200 and mins > 0 and ml > 0 and is_state('input_boolean.sentinel_x1_calibrating', 'off') }}"
      - service: number.set_value
        target: { entity_id: number.kamoer_x1_pro_t_kamoer_cal_low_speed }
        data: { value: "{{ rpm }}" }
      - service: number.set_value
        target: { entity_id: number.kamoer_x1_pro_t_kamoer_cal_low }
        data: { value: "{{ (ml / mins) | round(3) }}" }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_cal_low_collected }
        data: { value: "{{ (ml / mins * 5) | round(2) }}" }

  # ---- wipe the calibration: nothing doses until it is recalibrated ----
  sentinel_x1_cal_clear:
    alias: Sentinel X1 · Clear calibration
    icon: mdi:beaker-remove
    mode: single
    sequence:
      - condition: state
        entity_id: input_boolean.sentinel_x1_calibrating
        state: "off"
      - service: switch.turn_off
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: number.set_value
        target: { entity_id: [number.kamoer_x1_pro_t_kamoer_cal_low, number.kamoer_x1_pro_t_kamoer_cal_200_rpm, number.kamoer_x1_pro_t_kamoer_cal_350_rpm] }
        data: { value: 0 }
      - service: number.set_value
        target: { entity_id: number.kamoer_x1_pro_t_kamoer_pulse_factor }
        data: { value: 1 }
      - service: input_number.set_value
        target: { entity_id: [input_number.sentinel_x1_cal_low_collected, input_number.sentinel_x1_pulse_check_ml, input_number.sentinel_x1_cal_expect_low, input_number.sentinel_x1_cal_expect_mid, input_number.sentinel_x1_cal_expect_high] }
        data: { value: 0 }
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.sentinel_x1_last_cal }
        data: { date: "2000-01-01" }
      # no 90-day "recalibrate" reminder: the Needs-calibration pause and banner cover it
      - service: input_boolean.turn_on
        target: { entity_id: input_boolean.sentinel_x1_cal_reminded }
      - delay: { seconds: 2 }
      - service: script.sentinel_x1_alert
        data:
          title: Sentinel X1 calibration cleared
          message: Calibration was wiped. Scheduled and manual dosing are blocked until all three speeds are calibrated again (Settings › Calibration).

  sentinel_x1_fault_clear:
    alias: Sentinel X1 · Clear pump fault
    icon: mdi:restore-alert
    sequence:
      - service: button.press
        target: { entity_id: button.kamoer_x1_pro_t_kamoer_clear_fault }
      - service: persistent_notification.dismiss
        data: { notification_id: sentinel_x1_sentinel_x1_pump_fault }

  sentinel_x1_cal_cancel:
    alias: Sentinel X1 · Cancel calibration run
    icon: mdi:close-circle
    sequence:
      - service: script.turn_off
        target:
          entity_id: [script.sentinel_x1_cal_run_low, script.sentinel_x1_cal_run_mid, script.sentinel_x1_cal_run_high, script.sentinel_x1_cal_run_pulses, script.sentinel_x1_test_run, script.sentinel_x1_prime]
      - service: switch.turn_off
        target: { entity_id: switch.kamoer_x1_pro_t_kamoer_continuous }
      - service: button.press
        target: { entity_id: button.kamoer_x1_pro_t_kamoer_stop }
      - service: timer.cancel
        target: { entity_id: timer.sentinel_x1_cal }
      - service: input_boolean.turn_off
        target: { entity_id: input_boolean.sentinel_x1_calibrating }

  sentinel_x1_cal_reminder_dismiss:
    alias: Sentinel X1 · Dismiss calibration reminder
    icon: mdi:bell-off
    sequence:
      - service: input_boolean.turn_on
        target: { entity_id: [input_boolean.sentinel_x1_cal_reminder_dismissed, input_boolean.sentinel_x1_cal_reminded] }
      - service: persistent_notification.dismiss
        data: { notification_id: sentinel_x1_cal_reminder }

  sentinel_x1_record_kh:
    alias: Sentinel X1 · Enter KH test
    icon: mdi:test-tube
    mode: queued
    fields:
      kh:
        name: KH test result
        description: Your hand test, in dKH
        required: true
        default: 8.3
        selector:
          number: { min: 3, max: 20, step: 0.01, unit_of_measurement: dKH, mode: box }
    sequence:
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_kh_manual }
        data: { value: "{{ kh }}" }
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.sentinel_x1_kh_manual_at }
        data: { timestamp: "{{ as_timestamp(now()) }}" }
      - if: "{{ is_state('input_select.sentinel_x1_kh_phase', 'Needs manual test') and is_state('input_boolean.sentinel_x1_kh_enabled', 'on') }}"
        then:
          - service: input_select.select_option
            target: { entity_id: input_select.sentinel_x1_kh_phase }
            data: { option: Ready }
          - delay: { seconds: 3 }
          - service: automation.trigger
            target: { entity_id: automation.sentinel_x1_kh_auto_tune }

  sentinel_x1_refilled:
    alias: Sentinel X1 · Container refilled
    icon: mdi:bottle-tonic-plus
    sequence:
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_container_ml }
        data: { value: "{{ states('input_number.sentinel_x1_container_size') | float(0) }}" }

  sentinel_x1_tube_changed:
    alias: Sentinel X1 · Tubing replaced
    icon: mdi:autorenew
    sequence:
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_tube_hours }
        data: { value: 0 }
      - service: script.sentinel_x1_alert
        data:
          title: "Sentinel X1 tubing replaced"
          message: "Recalibrate now: new tubing changes flow."

  sentinel_x1_calibrated:
    alias: Sentinel X1 · Re-checked, no change
    icon: mdi:beaker-check
    sequence:
      - service: input_boolean.turn_off
        target: { entity_id: [input_boolean.sentinel_x1_cal_reminded, input_boolean.sentinel_x1_cal_reminder_dismissed] }
      - service: persistent_notification.dismiss
        data: { notification_id: sentinel_x1_cal_reminder }
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.sentinel_x1_last_cal }
        data: { date: "{{ now().date() }}" }

  sentinel_x1_load_defaults:
    alias: Sentinel X1 · Load defaults (run once)
    icon: mdi:restore
    sequence:
      - service: input_select.select_option
        target: { entity_id: input_select.sentinel_x1_mode }
        data: { option: Auto }
      - service: input_select.select_option
        target: { entity_id: input_select.sentinel_x1_window }
        data: { option: "24 hours" }
      - service: input_select.select_option
        target: { entity_id: input_select.sentinel_x1_curve }
        data: { option: Flat }
      - service: input_select.select_option
        target: { entity_id: input_select.sentinel_x1_missed }
        data: { option: "Catch up over 6 h" }
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.sentinel_x1_start }
        data: { time: "08:00:00" }
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.sentinel_x1_stop }
        data: { time: "22:00:00" }
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.sentinel_x1_lights_on }
        data: { time: "10:00:00" }
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.sentinel_x1_lights_off }
        data: { time: "20:00:00" }
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.sentinel_x1_feed_start }
        data: { time: "18:00:00" }
      - service: input_datetime.set_datetime
        target: { entity_id: input_datetime.sentinel_x1_last_cal }
        data: { date: "{{ now().date() }}" }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_feed_minutes }
        data: { value: 30 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_min_rpm }
        data: { value: 30 }
      - service: input_boolean.turn_off
        target: { entity_id: [input_boolean.sentinel_x1_calibrating, input_boolean.sentinel_x1_cal_reminded, input_boolean.sentinel_x1_cal_reminder_dismissed] }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_pulse_rpm }
        data: { value: 200 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_min_pulse }
        data: { value: 0.1 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_daily_cap_pct }
        data: { value: 110 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_hourly_cap_x }
        data: { value: 1.5 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_manual_max }
        data: { value: 10 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_manual_ml }
        data: { value: 1 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_ph_stop }
        data: { value: 8.6 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_ph_resume }
        data: { value: 7.8 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_ph_target }
        data: { value: 8.29 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_ph_max_ml_h }
        data: { value: 20 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_ph_max_ml_day }
        data: { value: 300 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_ph_max_kh }
        data: { value: 11 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_container_size }
        data: { value: 2500 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_container_ml }
        data: { value: 2500 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_container_alert_days }
        data: { value: 7 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_container_stop_ml }
        data: { value: 50 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_tube_life }
        data: { value: 2000 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_kh_target }
        data: { value: 8.3 }
      - service: input_boolean.turn_on
        target: { entity_id: [input_boolean.sentinel_x1_ramp, input_boolean.sentinel_x1_feed_enabled] }
      - service: input_boolean.turn_off
        target: { entity_id: [input_boolean.sentinel_x1_kh_enabled, input_boolean.sentinel_x1_enabled] }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_prime_seconds }
        data: { value: 10 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_feed_minutes }
        data: { value: 10 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_maint_minutes }
        data: { value: 60 }
      - service: input_number.set_value
        target: { entity_id: [input_number.sentinel_x1_feed_n, input_number.sentinel_x1_maint_n] }
        data: { value: 1 }
      - service: input_select.select_option
        target: { entity_id: input_select.sentinel_x1_pause_kind }
        data: { option: "Off" }
      - service: input_select.select_option
        target: { entity_id: input_select.sentinel_x1_volume_unit }
        data: { option: "US gal" }
      - service: input_select.select_option
        target: { entity_id: input_select.sentinel_x1_kh_phase }
        data: { option: "Off" }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_kh_max_rise }
        data: { value: 0.5 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_kh_wait_days }
        data: { value: 3 }
      - service: input_number.set_value
        target: { entity_id: input_number.sentinel_x1_kh_tolerance }
        data: { value: 30 }
